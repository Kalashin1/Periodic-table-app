<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atom and molecule lab</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f2a3a; --bg2:#050b14; --ink:#eef4f8; --muted:#9fb3c2; --panel:rgba(14,32,46,.76); --line:rgba(255,255,255,.2); --accent:#4cc9f0;
  color-scheme:dark; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#0f2a3a; --bg2:#050b14; } }
:root[data-theme="light"]{ --bg1:#1f4a63; --bg2:#0b1b2a; }
:root[data-theme="dark"]{ --bg1:#0f2a3a; --bg2:#050b14; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 42%,var(--bg1),var(--bg2));color:var(--ink);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.hover{cursor:pointer} canvas.drag{cursor:grabbing}

header{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-right,0px)) 0 calc(22px + env(safe-area-inset-left,0px));pointer-events:none;z-index:3}
h1{margin:0;font-size:clamp(30px,7vw,54px);font-weight:600;letter-spacing:-.02em;line-height:1;max-width:70%}
header p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:70%}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px}

#card{margin-top:12px;padding:11px 15px;max-width:340px;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
#card.on{opacity:1;transform:none}
#card b{display:block;font-size:16px;margin-bottom:2px}
#card dl{margin:5px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;color:var(--muted)}
#card dd{margin:0;color:var(--ink)}
#card span{display:block;margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--muted)}

#menuWrap{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end}
#tbRow{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
#menuBtn,#uiBtn{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#menu,#uiMenu{position:absolute;right:0;top:44px;min-width:180px;padding:6px;display:flex;flex-direction:column;gap:2px}
#uiMenu{min-width:214px;padding:8px}
#menu button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer}
#menu button[aria-current="true"]{background:var(--ink);color:#0b1b2a}
.uiRow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:8px 10px;border-radius:9px;cursor:pointer;user-select:none}
.uiRow:hover{background:rgba(255,255,255,.08)}
.uiRow input{accent-color:var(--accent);width:17px;height:17px;margin:0;cursor:pointer}
#uiMenu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
#focusBtn{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer}
#focusBtn:hover{background:rgba(255,255,255,.08)}
#showUI{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:.7;transition:opacity .2s}
#showUI:hover,#showUI:focus-visible{opacity:1}

#ladder{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(68px + env(safe-area-inset-top,0px));padding:6px 8px 5px;color:var(--ink);z-index:2}
#ladder .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:1px}
#ladder .lhead span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#ladder .lx{width:18px;height:18px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#ladder .lx:hover{background:rgba(255,255,255,.12);color:var(--ink)}
#ladder small{display:block;text-align:center;color:var(--muted);font-size:10px;margin-top:2px}

footer{position:fixed;left:0;right:0;bottom:0;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.bar{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:11px;height:11px;border-radius:50%;display:block;flex:none}
.legend b{font-variant-numeric:tabular-nums}
#tableLegend{flex-wrap:nowrap;overflow-x:auto;font-size:12px;padding-bottom:2px;scrollbar-width:none}
#tableLegend::-webkit-scrollbar{display:none}
.switch[aria-checked="true"],.chip[aria-pressed="true"],.chip[aria-expanded="true"]{background:var(--ink);color:#0b1b2a;border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;border-radius:10px;cursor:pointer}
.chip small{position:absolute;top:3px;left:5px;font-size:9px;font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"] small{color:#3a4c5c}
.chip.wide{width:auto;height:34px;padding:0 14px;font-size:13px;font-weight:400}
.speed{display:flex;align-items:center;gap:12px;font-size:14px}
.speed label{color:var(--muted);white-space:nowrap}
.speed output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,#menu button:focus-visible,#uiMenu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body.hide-header header h1,
body.hide-header header p{display:none!important}
body.hide-header #card{margin-top:0}
body.hide-ladder #ladder{display:none!important}
body.hide-panel footer .bar{display:none!important}
body.hide-card #card{display:none!important}
body.focus header,
body.focus footer,
body.focus #ladder,
body.focus #menuWrap{display:none!important}

@media (max-height:560px){
  header{padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 0 calc(16px + env(safe-area-inset-left,0px))}
  h1{font-size:clamp(17px,3.4vw,26px);max-width:56%}
  header p{font-size:11.5px;margin-top:3px;max-width:56%}
  #card{margin-top:7px;padding:8px 11px;max-width:340px;border-radius:11px}
  #card b{font-size:14px;margin-bottom:1px}
  #card dl{font-size:11.5px;gap:1px 9px;margin-top:3px}
  #card span{font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #menuWrap{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
  #tbRow{gap:6px}
  .btn{padding:5px 11px;font-size:12px}
  #menu,#uiMenu{top:38px}
  #uiMenu{min-width:196px;padding:6px}
  .uiRow{font-size:13px;padding:6px 9px}
  #focusBtn{font-size:13px;padding:7px 9px}
  #ladder{top:calc(48px + env(safe-area-inset-top,0px));transform:scale(.72);transform-origin:top right}
  footer{padding:0 calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));gap:6px}
  .bar{padding:7px 9px;gap:7px;border-radius:12px}
  .sec{gap:7px}
  .row{gap:7px}
  .chip{width:36px;height:36px;font-size:13px;border-radius:9px}
  .chip small{font-size:8px;top:2px;left:4px}
  .chip.wide{height:30px;padding:0 11px;font-size:12px}
  .legend{font-size:12px;gap:9px}
  .legend i{width:9px;height:9px}
  .speed{font-size:12px;gap:9px}
}
@media (orientation:landscape) and (max-height:560px){
  #card{max-width:44vw}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D viewer"></canvas>
<header>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="card" class="glass" role="status"><b></b><dl id="dl"></dl><span></span></div>
</header>

<div id="menuWrap">
  <div id="tbRow">
    <button class="btn" id="uiBtn" aria-haspopup="true" aria-expanded="false" title="Interface options">UI</button>
    <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menu</button>
  </div>
  <div id="menu" class="glass" hidden>
    <button data-view="atom">Atom model</button>
    <button data-view="mol">Hydrocarbons</button>
    <button data-view="amino">Amino acids</button>
    <button data-view="solar">Milky Way</button>
    <button data-view="table">Periodic table</button>
  </div>
  <div id="uiMenu" class="glass" hidden>
    <label class="uiRow"><span>Header</span><input type="checkbox" id="tHeader" checked></label>
    <label class="uiRow"><span>Energy levels</span><input type="checkbox" id="tLadder" checked></label>
    <label class="uiRow"><span>Controls panel</span><input type="checkbox" id="tPanel" checked></label>
    <label class="uiRow"><span>Info card</span><input type="checkbox" id="tCard" checked></label>
    <hr>
    <button id="focusBtn" type="button">Hide all interface</button>
  </div>
</div>
<button id="showUI" type="button" hidden>Show UI</button>
<div id="ladder" class="glass" aria-label="Energy levels"></div>

<footer>
  <div class="bar glass">
    <div class="sec" id="atomUI">
      <div class="row">
        <div class="legend">
          <span><i style="background:var(--accent)"></i>Electrons <b id="ne"></b></span>
          <span><i style="background:#ff5a6e"></i>Protons <b id="np"></b></span>
          <span><i style="background:#a8b4cc"></i>Neutrons <b id="nn"></b></span>
        </div>
        <button class="btn switch" id="cloud" role="switch" aria-checked="false">Electron cloud</button>
      </div>
      <div class="chips" id="parts" role="group" aria-label="Focus on a part of the atom"></div>
      <div class="chips" id="chips" role="group" aria-label="Choose an element"></div>
      <div class="chips" id="isoChips" role="group" aria-label="Choose an isotope"></div>
    </div>
    <div class="sec" id="molUI" hidden>
      <div class="row">
        <div class="legend" id="molLegend"></div>
        <button class="btn switch" id="fill" role="switch" aria-checked="false">Space filling</button>
      </div>
      <div class="chips" id="pickHeads" role="group" aria-label="Categories"></div>
      <div class="chips" id="pickItems" role="group" aria-label="Compounds" hidden></div>
    </div>
    <div class="sec" id="solarUI" hidden>
      <div class="chips" id="solarSystems" role="group" aria-label="Local systems">
        <button class="chip wide" data-dest="local" type="button">Local Area</button>
        <button class="chip wide" data-dest="sys:0" type="button" aria-pressed="true">Solar System</button>
        <button class="chip wide" data-dest="sys:1" type="button">Proxima</button>
        <button class="chip wide" data-dest="sys:2" type="button">Alpha Cen</button>
        <button class="chip wide" data-dest="sys:3" type="button">Sirius</button>
        <button class="chip wide" data-dest="sys:4" type="button">Tau Ceti</button>
        <button class="chip wide" data-dest="sys:5" type="button">Trappist-1</button>
        <button class="chip wide" data-dest="sys:6" type="button">Betelgeuse</button>
        <button class="chip wide" data-dest="sys:7" type="button">Rigel</button>
        <button class="chip wide" data-dest="sys:8" type="button">Epsilon Eri</button>
        <button class="chip wide" data-dest="sys:9" type="button">51 Peg</button>
        <button class="chip wide" data-dest="sys:10" type="button">61 Cygni</button>
        <button class="chip wide" data-dest="sys:11" type="button">Vega</button>
        <button class="chip wide" data-dest="sys:12" type="button">Arcturus</button>
        <button class="chip wide" data-dest="sys:13" type="button">Antares</button>
        <button class="chip wide" data-dest="sys:14" type="button">Polaris</button>
        <button class="chip wide" data-dest="sys:15" type="button">Aldebaran</button>
        <button class="chip wide" data-dest="sys:16" type="button">Capella</button>
        <button class="chip wide" data-dest="sys:17" type="button">HD 10180</button>
        <button class="chip wide" data-dest="sys:18" type="button">Kepler-90</button>
        <button class="chip wide" data-dest="ex:0" type="button">Cygnus X-1</button>
        <button class="chip wide" data-dest="ex:1" type="button">V616 Mon</button>
        <button class="chip wide" data-dest="ex:2" type="button">Neutron star</button>
        <button class="chip wide" data-dest="ex:3" type="button">Black hole</button>
        <button class="chip wide" data-dest="sgr" type="button">Sagittarius A*</button>
        <button class="chip wide" data-dest="neb:0" type="button">Orion Nebula</button>
        <button class="chip wide" data-dest="neb:1" type="button">Crab Nebula</button>
        <button class="chip wide" data-dest="neb:2" type="button">Eagle Nebula</button>
        <button class="chip wide" data-dest="neb:3" type="button">Helix Nebula</button>
        <button class="chip wide" data-dest="neb:4" type="button">Carina Nebula</button>
        <button class="chip wide" data-dest="overview" type="button">Milky Way</button>
      </div>
      <div class="chips" id="solarTools" role="group" aria-label="Milky Way controls">
        <button class="chip wide" id="solarOrbits" type="button" aria-pressed="true">Orbits</button>
        <button class="chip wide" id="solarMoons" type="button" aria-pressed="true">Moons</button>
        <button class="chip wide" id="solarFabric" type="button" aria-pressed="true">Spacetime</button>
      </div>
    </div>
    <div class="sec" id="tableUI" hidden>
      <div class="legend" id="tableLegend" aria-label="Element categories"></div>
      <div class="chips" id="tableTools" role="group" aria-label="Zoom and view controls">
        <button class="chip wide" id="zoomOut" type="button">Zoom −</button>
        <button class="chip wide" id="zoomIn" type="button">Zoom +</button>
        <button class="chip wide" id="resetTable" type="button">Reset view</button>
      </div>
    </div>
    <div class="speed" id="speedRow">
      <label for="speed" id="speedLabel">Electron speed</label>
      <input id="speed" type="range" min="0" max="5" step="0.1" value="1">
      <output id="speedOut" for="speed">1.0×</output>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('c'), card = $('card'), slider = $('speed');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const V = THREE.Vector3, Zax = new V(0,0,1), YA = new V(0,1,0);
  const sub = s => String(s).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);
  const sup = s => String(s).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

  // ============ UI ============
  const UI = {header:true, ladder:true, panel:true, card:true, focus:false};
  const UI_KEY='atomlab.ui.v1';
  function loadUI(){
    try{ const s=JSON.parse(localStorage.getItem(UI_KEY)||'null');
      if(s&&typeof s==='object'){ ['header','ladder','panel','card'].forEach(k=>{ if(typeof s[k]==='boolean') UI[k]=s[k]; }); }
    }catch(_){}
  }
  function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify({header:UI.header,ladder:UI.ladder,panel:UI.panel,card:UI.card})); }catch(_){} }
  function applyUI(){
    const b=document.body;
    b.classList.toggle('hide-header', !UI.header);
    b.classList.toggle('hide-ladder', !UI.ladder);
    b.classList.toggle('hide-panel', !UI.panel);
    b.classList.toggle('hide-card', !UI.card);
    b.classList.toggle('focus', !!UI.focus);
    $('tHeader').checked=UI.header;
    $('tLadder').checked=UI.ladder;
    $('tPanel').checked=UI.panel;
    $('tCard').checked=UI.card;
    $('showUI').hidden=!UI.focus;
    if(!UI.focus) closeUIMenu();
    saveUI();
  }
  loadUI();

  // ============ ELEMENT DATA ============
  const ELS = ('H Hydrogen 1|He Helium 4|Li Lithium 7|Be Beryllium 9|B Boron 11|C Carbon 12|N Nitrogen 14|O Oxygen 16|F Fluorine 19|Ne Neon 20|'+
    'Na Sodium 23|Mg Magnesium 24|Al Aluminium 27|Si Silicon 28|P Phosphorus 31|S Sulfur 32|Cl Chlorine 35|Ar Argon 40|K Potassium 39|Ca Calcium 40|'+
    'Sc Scandium 45|Ti Titanium 48|V Vanadium 51|Cr Chromium 52|Mn Manganese 55|Fe Iron 56|Co Cobalt 59|Ni Nickel 58|Cu Copper 63|Zn Zinc 64|'+
    'Ga Gallium 69|Ge Germanium 74|As Arsenic 75|Se Selenium 80|Br Bromine 79|Kr Krypton 84|Rb Rubidium 85|Sr Strontium 88|Y Yttrium 89|Zr Zirconium 90|'+
    'Nb Niobium 93|Mo Molybdenum 98|Tc Technetium 98|Ru Ruthenium 102|Rh Rhodium 103|Pd Palladium 106|Ag Silver 107|Cd Cadmium 114|In Indium 115|Sn Tin 120|'+
    'Sb Antimony 121|Te Tellurium 130|I Iodine 127|Xe Xenon 132|Cs Caesium 133|Ba Barium 138|La Lanthanum 139|Ce Cerium 140|Pr Praseodymium 141|Nd Neodymium 142|'+
    'Pm Promethium 145|Sm Samarium 152|Eu Europium 153|Gd Gadolinium 158|Tb Terbium 159|Dy Dysprosium 164|Ho Holmium 165|Er Erbium 166|Tm Thulium 169|Yb Ytterbium 174|'+
    'Lu Lutetium 175|Hf Hafnium 180|Ta Tantalum 181|W Tungsten 184|Re Rhenium 187|Os Osmium 192|Ir Iridium 193|Pt Platinum 195|Au Gold 197|Hg Mercury 202|'+
    'Tl Thallium 205|Pb Lead 208|Bi Bismuth 209|Po Polonium 209|At Astatine 210|Rn Radon 222|Fr Francium 223|Ra Radium 226|Ac Actinium 227|Th Thorium 232|'+
    'Pa Protactinium 231|U Uranium 238|Np Neptunium 237|Pu Plutonium 244|Am Americium 243|Cm Curium 247|Bk Berkelium 247|Cf Californium 251|Es Einsteinium 252|Fm Fermium 257|'+
    'Md Mendelevium 258|No Nobelium 259|Lr Lawrencium 266|Rf Rutherfordium 267|Db Dubnium 268|Sg Seaborgium 269|Bh Bohrium 270|Hs Hassium 269|Mt Meitnerium 278|Ds Darmstadtium 281|'+
    'Rg Roentgenium 282|Cn Copernicium 285|Nh Nihonium 286|Fl Flerovium 289|Mc Moscovium 290|Lv Livermorium 293|Ts Tennessine 294|Og Oganesson 294').split('|').map(s=>{ const a=s.split(' '); return [a[0],a[1],+a[2]]; });
  const ISOTOPES = {1:[1,2,3],2:[3,4],3:[6,7],4:[9,10],5:[10,11],6:[12,13,14],7:[14,15],8:[16,17,18],9:[19],10:[20,21,22],11:[22,23,24],12:[24,25,26],13:[27],14:[28,29,30],15:[31,32,33],16:[32,33,34,36],17:[35,37],18:[36,38,40],19:[39,40,41],20:[40,42,43,44,46,48],26:[54,56,57,58],27:[59],28:[58,60,61,62,64],29:[63,65],30:[64,66,67,68,70],35:[79,81],47:[107,109],50:[112,114,115,116,117,118,119,120,122,124],53:[127,131],54:[129,131,132,134,136],55:[133],74:[182,183,184,186],78:[194,195,196,198],79:[197],80:[196,198,199,200,201,202,204],82:[206,207,208],86:[222],88:[226],90:[232],92:[234,235,238],94:[239,240,244]};
  function isotopesOf(Z){ if(ISOTOPES[Z]) return ISOTOPES[Z]; const A=ELS[Z-1][2]; return [A].filter(x=>x>=Z); }
  const ORDER=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];

  function createStar(type, radius){
    const cfg = STAR_TYPES[type] || STAR_TYPES['main-sequence'];
    const color = cfg.color;
    const group = new THREE.Group();
    group.add(new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 24), new THREE.MeshBasicMaterial({ color })));
    const glow1 = new THREE.Mesh(new THREE.SphereGeometry(radius*1.2, 32, 24), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:cfg.glow1, blending:THREE.AdditiveBlending, depthWrite:false })); group.add(glow1);
    const glow2 = new THREE.Mesh(new THREE.SphereGeometry(radius*1.6, 32, 24), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:cfg.glow2, blending:THREE.AdditiveBlending, depthWrite:false })); group.add(glow2);
    const corona = new THREE.Mesh(new THREE.SphereGeometry(radius*cfg.coronaScale, 32, 24), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:cfg.corona, blending:THREE.AdditiveBlending, depthWrite:false })); group.add(corona);
    let sparks = null;
    if (cfg.sparkCount > 0){
      const geo = new THREE.BufferGeometry(); const pos = new Float32Array(cfg.sparkCount*3);
      for (let i=0;i<cfg.sparkCount;i++){ const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), r=radius*(1.3+Math.random()*0.9); pos[i*3]=Math.sin(phi)*Math.cos(theta)*r; pos[i*3+1]=Math.cos(phi)*r; pos[i*3+2]=Math.sin(phi)*Math.sin(theta)*r; }

      sparks = new THREE.Points(geo, new THREE.PointsMaterial({ color:0xffffee, size:radius*cfg.sparkScale, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true }));
      group.add(sparks);
    }
    const light = new THREE.PointLight(color, cfg.light, radius*100); group.add(light);
    group.userData.starFx = { type:'star', glow1, glow2, corona, sparks, light, radius, pulseSpeed:cfg.pulseSpeed, pulseAmp:cfg.pulseAmp, baseGlow1:cfg.glow1, baseGlow2:cfg.glow2, baseCorona:cfg.corona, baseLight:cfg.light };

  // ============ BUILD ============
  function buildFabric(){
    const segments = 100, size = 900, half = size/2, step = size/segments;
    const verts = [];
    for(let i=0;i<=segments;i++){ const z=-half+i*step; for(let j=0;j<segments;j++){ const x1=-half+j*step, x2=x1+step; verts.push(x1,0,z,x2,0,z); } }
    for(let i=0;i<=segments;i++){ const x=-half+i*step; for(let j=0;j<segments;j++){ const z1=-half+j*step, z2=z1+step; verts.push(x,0,z1,x,0,z2); } }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    const colors=new Float32Array(verts.length);
    for(let i=0;i<verts.length/3;i++){ colors[i*3]=0.25; colors[i*3+1]=0.75; colors[i*3+2]=0.94; }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mesh=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.4,depthWrite:false}));
    mesh.position.y=-1; mesh.renderOrder=-1; solarRoot.add(mesh);
    SOLAR.fabric={mesh,geo,base:new Float32Array(verts),colors};
  }
  function updateFabric(){
    if(!SOLAR.fabric) return;
    const {geo,base}=SOLAR.fabric, pos=geo.attributes.position, col=geo.attributes.color;
    const masses=[];
    for(const sys of SOLAR.systems){ for(const star of sys.stars){ masses.push({x:sys.data.center.x+star.group.position.x, z:sys.data.center.z+star.group.position.z, mass:star.data.mass||40}); }
      for(const p of sys.planets){ masses.push({x:sys.data.center.x+p.group.position.x, z:sys.data.center.z+p.group.position.z, mass:p.mass}); } }
    for(const ex of SOLAR.exoticBodies){ masses.push({x:ex.data.position.x, z:ex.data.position.z, mass:ex.data.fabricMass||200}); }
    masses.push({x:0, z:0, mass:800}); // Sgr A*
    const mc=masses.length;
    for(let i=0;i<pos.count;i++){
      const x=base[i*3], z=base[i*3+2]; let dip=0;
      for(let mi=0;mi<mc;mi++){ const m=masses[mi]; const dx=x-m.x, dz=z-m.z; dip-=m.mass/(dx*dx+dz*dz+8); }
      if(dip<-45) dip=-45;
      pos.setY(i, dip);
      const depth=Math.min(1, -dip/32);
      col.setXYZ(i, 0.25+depth*0.7, 0.75-depth*0.65, 0.94-depth*0.85);
    }
    pos.needsUpdate=true; col.needsUpdate=true;
  }

  function buildGalaxyDisk(){
    const positions=[], colors=[];
    // 2 main spiral arms
    for(let arm=0; arm<2; arm++){
      const armOffset = arm*Math.PI;
      for(let i=0;i<3500;i++){
        const t = Math.pow(i/3500, 0.65);
        const angle = armOffset + t*Math.PI*3.2;
        const r = t*1600;
        const spread = 40 + t*140;
        const perpX = -Math.sin(angle), perpZ = Math.cos(angle);
        const s = (Math.random()-0.5)*spread;
        const x = Math.cos(angle)*r + perpX*s;
        const z = Math.sin(angle)*r + perpZ*s;
        const y = (Math.random()-0.5)*(15+t*40);
        positions.push(x, y, z);
        const c = 0.5 + Math.random()*0.5;
        colors.push(c*0.7, c*0.85, c);
      }
    }
    // Central bulge
    for(let i=0;i<1200;i++){
      const r = Math.pow(Math.random(), 2)*320;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      positions.push(Math.sin(phi)*Math.cos(theta)*r, Math.cos(phi)*r*0.35, Math.sin(phi)*Math.sin(theta)*r);
      const c = 0.7+Math.random()*0.3;
      colors.push(c, c*0.8, c*0.5);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({size:4, sizeAttenuation:false, vertexColors:true, transparent:true, opacity:0.55, depthWrite:false, blending:THREE.AdditiveBlending});
    const points = new THREE.Points(geo, mat);
    solarRoot.add(points);
    SOLAR.galaxyPoints = mat;
  }

  function buildNebula(data){
    const count = 500;
    const positions = new Float32Array(count*3), colors = new Float32Array(count*3);
    const c = new THREE.Color(data.color);
    for(let i=0;i<count;i++){
      const r = Math.pow(Math.random(), 0.6)*data.size;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      positions[i*3] = Math.sin(phi)*Math.cos(theta)*r;
      positions[i*3+1] = Math.cos(phi)*r*0.5;
      positions[i*3+2] = Math.sin(phi)*Math.sin(theta)*r;
      const bright = 0.5+Math.random()*0.5;
      colors[i*3]=c.r*bright; colors[i*3+1]=c.g*bright; colors[i*3+2]=c.b*bright;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({size:8, sizeAttenuation:true, vertexColors:true, transparent:true, opacity:0.45, depthWrite:false, blending:THREE.AdditiveBlending});
    const points = new THREE.Points(geo, mat);
    points.position.copy(data.position);

    // Invisible pickable sphere for easy clicking
    const pickSphere = new THREE.Mesh(
      new THREE.SphereGeometry(data.size*0.9, 12, 8),
      new THREE.MeshBasicMaterial({visible:false})
    );
    points.add(pickSphere);
    pickSphere.userData.nebula = data;

    const meta = { name:data.name, isNebula:true, systemIndex:-1, focusTarget:points, zoomRadius:data.size*2, info:data.info };
    pickSphere.userData.solar = meta;
    points.userData.nebula = data;
    points.userData.solar = meta;

    solarRoot.add(points);
    SOLAR.nebulae.push({data, points});
  }

  function buildStarSystem(sysData, sysIdx){
    const sysGroup = new THREE.Group();
    sysGroup.position.copy(sysData.center);
    solarRoot.add(sysGroup);
    const starObjs = [];
    for(const sd of sysData.stars){
      const starGroup = createStar(sd.type, sd.radius);
      sysGroup.add(starGroup);
      if(sd.orbitRadius){ const angle = sd.phase||0; starGroup.position.x = Math.cos(angle)*sd.orbitRadius; starGroup.position.z = Math.sin(angle)*sd.orbitRadius; }
      const meta = { name:sd.name, isStar:true, systemIndex:sysIdx, focusTarget:starGroup, starRadius:sd.radius, info:sd.info };
      starGroup.userData.solar = meta;
      starGroup.traverse(c => { if(c.isMesh||c.isPoints) c.userData.solar = meta; });
      starObjs.push({group:starGroup, data:sd, phase:sd.phase||0, orbitRadius:sd.orbitRadius||0, orbitSpeed:sd.orbitSpeed||0.4});
    }
    const planets = [];
    if(sysData.planets){
      for(const p of sysData.planets){
        const planetGroup = new THREE.Group();
        sysGroup.add(planetGroup);
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 20, 14),
          new THREE.MeshStandardMaterial({color:p.color, roughness:0.72, metalness:0.05, emissive:p.color, emissiveIntensity:0.1}));
        planetGroup.add(mesh);
        const meta = { name:p.name, planet:true, systemIndex:sysIdx, focusTarget:planetGroup, planetRadius:p.radius, info:p.info };
        mesh.userData.solar = meta;
        const pts = [];
        for(let i=0;i<=128;i++){ const a=i/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*p.orbitRadius, 0, Math.sin(a)*p.orbitRadius)); }
        const orbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:p.color, transparent:true, opacity:0.22}));
        sysGroup.add(orbitLine);
        if(p.ring){ const ring = new THREE.Mesh(new THREE.RingGeometry(p.radius*1.4, p.radius*2.2, 64), new THREE.MeshBasicMaterial({color:0xd8c088, side:THREE.DoubleSide, transparent:true, opacity:0.55})); ring.rotation.x = Math.PI/2+0.15; planetGroup.add(ring); }

      SOLAR.currentDest = 'sys:0';
      updateSolarChips();
      goal.target.copy(SOLAR.systems[0].data.center);
      goal.radius = 75;
      cam.target.copy(SOLAR.systems[0].data.center);
      cam.radius = 75;
      cam.theta = 0.4; cam.phi = 1.2; goal.theta = 0.4; goal.phi = 1.2;
      $('title').textContent='Milky Way';
      $('sub').textContent='Our home galaxy · drag to orbit · scroll out to see the whole galaxy · click any body for details';
      showCard('The Milky Way', [
        ['Galaxy', 'Barred spiral · SBbc'],
        ['Diameter', '~100,000 light-years'],
        ['Stars', '~200 billion'],
        ['Supermassive BH', 'Sagittarius A* (4.3 million M☉)']
      ], 'Zoom out to reveal the full galaxy — spiral arms, nebulae, and the supermassive black hole at its heart. Click any body or use the chips to explore.');
    } else { buildMol(curIdx[v]); goal.theta=0.6; goal.phi=1.2; enterView(); }
    document.querySelectorAll('#menu button').forEach(b=>b.setAttribute('aria-current', b.dataset.view===v));
    closeMenu(); closeUIMenu();
  }
  const menu=$('menu'), menuBtn=$('menuBtn'), uiMenu=$('uiMenu'), uiBtn=$('uiBtn');
  function closeMenu(){ menu.hidden=true; menuBtn.setAttribute('aria-expanded','false'); }
  function closeUIMenu(){ uiMenu.hidden=true; uiBtn.setAttribute('aria-expanded','false'); }
  menuBtn.addEventListener('click', ()=>{ const open=menu.hidden; closeUIMenu(); menu.hidden=!open; menuBtn.setAttribute('aria-expanded', String(open)); });
  uiBtn.addEventListener('click', ()=>{ const open=uiMenu.hidden; closeMenu(); uiMenu.hidden=!open; uiBtn.setAttribute('aria-expanded', String(open)); });
  menu.addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
  $('tHeader').addEventListener('change', e=>{ UI.header=e.target.checked; applyUI(); });
  $('tLadder').addEventListener('change', e=>{ UI.ladder=e.target.checked; applyUI(); });
  $('tPanel').addEventListener('change', e=>{ UI.panel=e.target.checked; applyUI(); });
  $('tCard').addEventListener('change', e=>{ UI.card=e.target.checked; applyUI(); });
  $('focusBtn').addEventListener('click', ()=>{ UI.focus=true; applyUI(); });
  $('showUI').addEventListener('click', ()=>{ UI.focus=false; applyUI(); });
  addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(UI.focus){ UI.focus=false; applyUI(); return; } closeMenu(); closeUIMenu(); });
  $('cloud').addEventListener('click', e=>{ cloudMode=!cloudMode; e.currentTarget.setAttribute('aria-checked', cloudMode); applyMode(); if(cloudMode && focused && focused.userData.kind==='e') reset(); });
  $('fill').addEventListener('click', e=>{ spaceFill=!spaceFill; e.currentTarget.setAttribute('aria-checked', spaceFill); applyStyle(); if(spaceFill && focused && focused.userData.kind==='bond') reset(); });
  if(reduceMotion) slider.value=0;
  const showSpeed=()=>{ $('speedOut').textContent=(+slider.value).toFixed(1)+'×'; };
  slider.addEventListener('input', showSpeed); showSpeed();

  // ============ CARD ============
  function showCard(title, rows, text){
    card.querySelector('b').textContent=title;
    $('dl').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');
    card.querySelector('span').textContent=text; card.classList.add('on');
  }
  function focusPart(s){
    focused=null; goal.target.set(0,0,0);
    rings.forEach((r,k)=>{ r.material.opacity=(s===k)?0.95:0.28; });
    if(s===null){ goal.radius=nucR*3+3; setPart(1); renderLadder(-1); showCard('Nucleus', [['Protons',cur.Z],['Neutrons',cur.N],['Mass number',cur.Z+cur.N]], 'Protons and neutrons packed together.'); }
    else { goal.radius=SHELL_R[s]*2.2+2; setPart(s+2); renderLadder(s); const outer=s===cur.sh.length-1;
      showCard('Shell '+(s+1)+' (n='+(s+1)+')', [['Electrons', cur.sh[s]+' of '+2*(s+1)*(s+1)],['Energy', s===0?'Lowest':outer?'Highest here':'Middle']], outer?'The outer shell. Its valence electrons decide how the atom bonds.':'Inner shells sit closer to the nucleus and have lower energy.'); }
  }
  function molText(d){
    const hasO2=d.cnt[2] && d.nbr.includes('O');
    if(d.el==='C') return hasO2 ? 'The carbonyl carbon: a flat group with a double bond to oxygen.' : d.hyb==='sp3'?'Four single bonds pointing to the corners of a tetrahedron.':d.hyb==='sp2'?'Flat, with three groups spread 120° apart.':'Linear, with a triple bond.';
    if(d.el==='N') return d.hyb==='sp2' ? 'Nitrogen in a C=N group.' : 'Nitrogen makes three bonds and keeps one lone pair.';
    if(d.el==='O') return d.cnt[2] ? 'Double-bonded oxygen, the C=O of a carbonyl group.' : 'Single-bonded oxygen, as in a hydroxyl (–OH) group.';
    if(d.el==='S') return 'Sulfur in the side chain.';
    return 'Hydrogen shares one electron pair with its neighbor.';
  }
  function focus(o){
    focused=o; const d=o.userData;
    rings.forEach(r=>{ r.material.opacity=0.28; });
    if(view!=='atom'){
      if(d.kind==='bond'){ goal.radius=3.2; const bi=bondInfo(d.ea,d.eb,d.o,d.ar), kind=d.ar?'aromatic':({1:'single',2:'double',3:'triple'})[d.o];
        showCard('Bond: '+d.ea+(d.o===2?'=':d.o===3?'≡':'–')+d.eb, [['Atoms',EN[d.ea]+' and '+EN[d.eb]],['Type',kind],['Length',bi[0]+' Å'],['Energy',bi[1]+' kJ/mol']], 'A chemical bond.'); return; }
      goal.radius=d.el==='H'?2.8:3.4;
      const rows=d.el==='H' ? [['Bonded to',[...new Set(d.nbr)].map(e=>EN[e].toLowerCase()).join(', ')],['Bond','single']] : [['Hybridization',d.hyb],['Bond angle',ANG[d.hyb]+'°'],['Bonds',d.bonds]];
      showCard(EN[d.el]+' atom', rows, molText(d)); return;
    }
    setPart(-1); goal.radius=d.kind==='e'?3.5:2.4;
    if(d.kind==='e'){ renderLadder(d.shell-1); showCard('Electron, energy level n='+d.shell, [['Charge','−1'],['Shell', d.shell+' of '+d.total],['Shell holds', d.count+' of '+d.cap],['Valence', d.valence?'Yes':'No']], d.valence?'An outer shell electron.':'An inner shell electron.'); }
    else if(d.kind==='p') showCard('Proton', [['Charge','+1'],['Mass','1.007 u']], 'The number of protons decides which element this is.');
    else showCard('Neutron', [['Charge','0'],['Mass','1.009 u']], 'Neutrons add mass and help hold the nucleus together.');
  }
  function reset(){
    focused=null;
    if(view !== 'solar') goal.target.set(0,0,0);
    goal.radius=defR;
    rings.forEach(r=>{ r.material.opacity=0.28; });
    card.classList.remove('on'); setPart(0); renderLadder(-1);
  }

  // ============ CAMERA ============
  const cam={theta:0.6, phi:1.2, radius:14, target:new V()}, goal={theta:0.6, phi:1.2, radius:14, target:new V()};
  const R_MIN=1.5, R_MAX=5000;
  let dragging=false, moved=0, mode='orbit', hovered=null, focused=null, lastHover=null, userZoomed=false, pinch=null;
  let lastX=0, lastY=0;
  const ptrs=new Map();
  const mouse=new THREE.Vector2(9,9), ray=new THREE.Raycaster();
  ray.near=0.01;
  const pickables=()=>{
    if(view==='table') return tableCells;
    if(view==='solar'){
      const items = [];
      for(const sys of SOLAR.systems){ for(const s of sys.stars) items.push(s.group); for(const p of sys.planets){ items.push(p.mesh); for(const m of p.moons) items.push(m.mesh); } }
      for(const ex of SOLAR.exoticBodies) items.push(ex.bodyGroup);
      if(SOLAR.sgrA) items.push(SOLAR.sgrA);
      for(const neb of SOLAR.nebulae) items.push(neb.points);
      return items;
    }
    if(view!=='atom') return spaceFill ? molAtoms : molAtoms.concat(molBonds);
    return cloudMode ? nucleusParts : nucleusParts.concat(electrons);
  };
  function zoomBy(f){ goal.radius=clamp(goal.radius*f, R_MIN, R_MAX); userZoomed=true; }
  function panBy(dx,dy){
    if(view!=='table') return;
    const s=2*goal.radius*Math.tan(camera.fov*Math.PI/360)/innerHeight;
    const right=new V().setFromMatrixColumn(camera.matrixWorld,0);
    const up=new V().setFromMatrixColumn(camera.matrixWorld,1);
    goal.target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s);
    goal.target.x=clamp(goal.target.x,-TW/2,TW/2); goal.target.y=clamp(goal.target.y,-TH/2,TH/2); goal.target.z=0;
  }
  canvas.addEventListener('pointerdown', e=>{
    closeMenu(); closeUIMenu();
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    canvas.classList.add('drag');
    if(ptrs.size===1){ dragging=true; moved=0; mode=(view==='table'&&!e.shiftKey)?'pan':'orbit'; lastX=e.clientX; lastY=e.clientY; }
    else { moved=99; pinch=null; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; } }
  });
  canvas.addEventListener('pointermove', e=>{
    mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){ moved=99; const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2; if(pinch){ zoomBy(pinch.d/d); panBy(mx-pinch.mx, my-pinch.my); } pinch={d,mx,my}; return; }
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; moved+=Math.abs(dx)+Math.abs(dy);
    if(mode==='pan') panBy(dx,dy); else { goal.theta-=dx*0.006; goal.phi=clamp(goal.phi-dy*0.006,0.5,2.5); }
    lastX=e.clientX; lastY=e.clientY;
  });
  function endPtr(e, tap){
    ptrs.delete(e.pointerId);
    if(ptrs.size<2) pinch=null;
    if(ptrs.size===1){ const p=[...ptrs.values()][0]; lastX=p.x; lastY=p.y; }
    if(ptrs.size>0) return;
    dragging=false; canvas.classList.remove('drag');
    if(!tap || moved>=5) return;
    mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(pickables(), true)[0];
    if(view==='table'){ if(hit) handleTableTap(hit.object.userData.Z); else { clearTableSelection(); lastHover=null; card.classList.remove('on'); } }
    else if(view==='solar'){ if(hit && hit.object.userData.solar) focusSolar(hit.object); }
    else { hit ? focus(hit.object) : reset(); }
  }
  canvas.addEventListener('pointerup', e=>endPtr(e,true));
  canvas.addEventListener('pointercancel', e=>endPtr(e,false));
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); const d=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1); zoomBy(Math.exp(d*0.0012)); }, {passive:false});
  $('zoomIn').addEventListener('click', ()=>zoomBy(0.72));
  $('zoomOut').addEventListener('click', ()=>zoomBy(1/0.72));
  $('resetTable').addEventListener('click', ()=>{ goal.theta=0; goal.phi=1.26; goal.target.set(0,0,0); goal.radius=tableFit(); userZoomed=false; clearTableSelection(); lastHover=null; card.classList.remove('on'); });
  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(view==='table' && tableBuilt){ defR=tableFit(); if(!userZoomed) goal.radius=defR; } }
  addEventListener('resize', resize); addEventListener('orientationchange', ()=>setTimeout(resize,220));
  if(window.visualViewport) visualViewport.addEventListener('resize', ()=>setTimeout(resize,140));
  resize();

  const clock=new THREE.Clock();
  build(5); setView('atom'); applyUI();

  function tick(){
    const dt=Math.min(clock.getDelta(),0.1), t=clock.getElapsedTime(), speed=+slider.value;
    if(view==='atom'){
      electrons.forEach(e=>{ const d=e.userData; d.angle+=dt*d.speed*speed; e.position.set(Math.cos(d.angle)*d.r,0,Math.sin(d.angle)*d.r); });
      if(!reduceMotion){ nucleusParts.forEach(m=>{ const d=m.userData,w=0.008; m.position.set(d.base0.x+Math.sin(t*3+d.phase)*w, d.base0.y+Math.cos(t*2.6+d.phase)*w, d.base0.z+Math.sin(t*3.3+d.phase*1.7)*w); }); clouds.forEach((c,i)=>{ c.rotation.y+=dt*0.05*(i+1); }); }
    } else if(view==='mol' || view==='amino'){ molRoot.rotation.y+=dt*speed*0.3; }
    else if(view==='solar'){ updateSolar(dt); }

    // Pull target toward origin at extreme zoom out (galaxy view)
    if(view === 'solar' && !focused && goal.radius > 800){
      goal.target.x *= 0.97; goal.target.z *= 0.97;
    }

    // Update title based on solar zoom level
    if(view === 'solar' && !focused && goal.radius !== undefined){
      const r = cam.radius;
      let title, s2;
      if (r < 150) { title = 'Solar System'; s2 = 'The Sun and its 8 planets · click any body'; }
      else if (r < 500) { title = 'Local neighborhood'; s2 = 'Nearby star systems within ~30 light-years'; }
      else if (r < 1500) { title = 'Orion Arm'; s2 = 'Our position in the Milky Way, ~26,000 ly from the centre'; }
      else { title = 'The Milky Way'; s2 = 'A barred spiral galaxy ~100,000 ly across'; }
      if ($('title').textContent !== title){ $('title').textContent = title; $('sub').textContent = s2; }
    }

    const root=view==='atom'?atomRoot:view==='table'?tableRoot:view==='solar'?solarRoot:molRoot;
    const k0=Math.min(1,(t-born)/0.5), s=reduceMotion?1:1-Math.pow(1-k0,3); root.scale.setScalar(0.4+0.6*s);

    if(!dragging && !reduceMotion && !focused && view!=='table' && view!=='solar') goal.theta+=dt*0.08;
    const k=1-Math.pow(0.001,dt);
    if(focused) focused.getWorldPosition(goal.target);
    cam.theta+=(goal.theta-cam.theta)*k; cam.phi+=(goal.phi-cam.phi)*k; cam.radius+=(goal.radius-cam.radius)*k; cam.target.lerp(goal.target,k);
    camera.position.set(cam.target.x+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta), cam.target.y+cam.radius*Math.cos(cam.phi), cam.target.z+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta));
    camera.lookAt(cam.target);

    ray.setFromCamera(mouse,camera);
    const list=pickables();
    hovered = list.length ? ray.intersectObjects(list, true)[0] || null : null;
    canvas.classList.toggle('hover', !!hovered && !dragging);

    if(view==='table'){
      const zt = clamp((defR/Math.max(cam.radius,0.001) - 1)/1.6, 0, 1);
      const grow = 1 + 0.16*(zt*zt*(3-2*zt));
      const hv = hovered ? hovered.object : null;
      const kPos = 1 - Math.exp(-dt/0.16), kScale = 1 - Math.exp(-dt/0.2);
      tableCells.forEach(o=>{
        const u = o.userData; const on = (hv === o);
        u.hover += ((on ? 1.05 : 1) - u.hover) * kScale;
        u.lift += ((on ? 0.24 : 0) - u.lift) * kPos;
        const tx = u.baseX + u.selX, ty = u.baseY + u.selY, tz = u.selZ + u.lift;
        o.position.x += (tx - o.position.x) * kPos; o.position.y += (ty - o.position.y) * kPos; o.position.z += (tz - o.position.z) * kPos;
        const targetScale = grow * u.selScale * u.hover; const cur = o.scale.x;
        o.scale.setScalar(cur + (targetScale - cur) * kScale);
        const eTarget = clamp((u.hover - 1) * 4 + (u.Z === selectedZ ? 0.45 : 0), 0, 0.8);
        u.body.emissiveIntensity += (eTarget - u.body.emissiveIntensity) * kScale;
      });
    } else if(view==='solar'){
      const hv = hovered ? hovered.object : null;
      list.forEach(o=>{ if(!o) return; o.traverse(c => { if(c.isMesh && c.material && c.material.emissiveIntensity !== undefined){ const base = (c.userData.solar && (c.userData.solar.isStar || c.userData.solar.isExotic || c.userData.solar.isNebula)) ? 0.35 : 0.1; const target = (hv && (hv === c || (hv.parent && hv.parent === c))) ? base + 0.4 : base; c.material.emissiveIntensity += (target - c.material.emissiveIntensity) * 0.15; } }); });
    } else {
      list.forEach(o=>{ if(!o.userData) return; const u=o.userData; if(u.solar) return; const want=((hovered&&hovered.object===o)||focused===o)?1.3:1; u.hover=(u.hover||1)+(want-(u.hover||1))*0.2; if(u.kind==='bond') o.scale.set(u.bx*u.hover,u.len,u.bx*u.hover); else o.scale.setScalar((u.base||1)*u.hover); });
    }

    if(view==='table'){
      const o = hovered ? hovered.object : null;
      if(o !== lastHover){
        lastHover = o;
        if(o){ const Z=o.userData.Z, el=ELS[Z-1]; showCard(el[1], [['Symbol',el[0]],['Atomic number',Z],['Mass number',el[2]],['Type',CATS[catOf(Z)]]], 'Tap again to open this atom in 3D.'); }
        else if(selectedSection){ const info=SECTION_INFO[selectedSection]; if(info) showCard(info.name, [], info.desc + ' Tap the same element again to open its atom.'); else card.classList.remove('on'); }
        else card.classList.remove('on');
      }
    }
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
