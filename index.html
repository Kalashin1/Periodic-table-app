<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atom and molecule lab</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f2a3a; --bg2:#050b14; --ink:#eef4f8; --muted:#9fb3c2; --panel:rgba(14,32,46,.76); --line:rgba(255,255,255,.2); --accent:#4cc9f0;
  color-scheme:dark; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#0f2a3a; --bg2:#050b14; } }
:root[data-theme="light"]{ --bg1:#1f4a63; --bg2:#0b1b2a; }
:root[data-theme="dark"]{ --bg1:#0f2a3a; --bg2:#050b14; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 42%,var(--bg1),var(--bg2));color:var(--ink);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.hover{cursor:pointer} canvas.drag{cursor:grabbing}

header{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-right,0px)) 0 calc(22px + env(safe-area-inset-left,0px));pointer-events:none;z-index:3}
h1{margin:0;font-size:clamp(30px,7vw,54px);font-weight:600;letter-spacing:-.02em;line-height:1;max-width:70%}
header p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:70%}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px}

#card{margin-top:12px;padding:11px 15px;max-width:340px;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
#card.on{opacity:1;transform:none}
#card b{display:block;font-size:16px;margin-bottom:2px}
#card dl{margin:5px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;color:var(--muted)}
#card dd{margin:0;color:var(--ink)}
#card span{display:block;margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--muted)}

#menuWrap{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end}
#tbRow{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
#menuBtn,#uiBtn{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#menu,#uiMenu{position:absolute;right:0;top:44px;min-width:180px;padding:6px;display:flex;flex-direction:column;gap:2px}
#uiMenu{min-width:214px;padding:8px}
#menu button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer}
#menu button[aria-current="true"]{background:var(--ink);color:#0b1b2a}
.uiRow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:8px 10px;border-radius:9px;cursor:pointer;user-select:none}
.uiRow:hover{background:rgba(255,255,255,.08)}
.uiRow input{accent-color:var(--accent);width:17px;height:17px;margin:0;cursor:pointer}
#uiMenu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
#focusBtn{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer}
#focusBtn:hover{background:rgba(255,255,255,.08)}
#showUI{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:.7;transition:opacity .2s}
#showUI:hover,#showUI:focus-visible{opacity:1}

#ladder{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(68px + env(safe-area-inset-top,0px));padding:6px 8px 5px;color:var(--ink);z-index:2}
#ladder .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:1px}
#ladder .lhead span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#ladder .lx{width:18px;height:18px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#ladder .lx:hover{background:rgba(255,255,255,.12);color:var(--ink)}
#ladder small{display:block;text-align:center;color:var(--muted);font-size:10px;margin-top:2px}

footer{position:fixed;left:0;right:0;bottom:0;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.bar{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:11px;height:11px;border-radius:50%;display:block;flex:none}
.legend b{font-variant-numeric:tabular-nums}
#tableLegend{flex-wrap:nowrap;overflow-x:auto;font-size:12px;padding-bottom:2px;scrollbar-width:none}
#tableLegend::-webkit-scrollbar{display:none}
.switch[aria-checked="true"],.chip[aria-pressed="true"],.chip[aria-expanded="true"]{background:var(--ink);color:#0b1b2a;border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;border-radius:10px;cursor:pointer}
.chip small{position:absolute;top:3px;left:5px;font-size:9px;font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"] small{color:#3a4c5c}
.chip.wide{width:auto;height:34px;padding:0 14px;font-size:13px;font-weight:400}
.speed{display:flex;align-items:center;gap:12px;font-size:14px}
.speed label{color:var(--muted);white-space:nowrap}
.speed output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,#menu button:focus-visible,#uiMenu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body.hide-header header h1,
body.hide-header header p{display:none!important}
body.hide-header #card{margin-top:0}
body.hide-ladder #ladder{display:none!important}
body.hide-panel footer .bar{display:none!important}
body.hide-card #card{display:none!important}
body.focus header,
body.focus footer,
body.focus #ladder,
body.focus #menuWrap{display:none!important}

@media (max-height:560px){
  header{padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 0 calc(16px + env(safe-area-inset-left,0px))}
  h1{font-size:clamp(17px,3.4vw,26px);max-width:56%}
  header p{font-size:11.5px;margin-top:3px;max-width:56%}
  #card{margin-top:7px;padding:8px 11px;max-width:340px;border-radius:11px}
  #card b{font-size:14px;margin-bottom:1px}
  #card dl{font-size:11.5px;gap:1px 9px;margin-top:3px}
  #card span{font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #menuWrap{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
  #tbRow{gap:6px}
  .btn{padding:5px 11px;font-size:12px}
  #menu,#uiMenu{top:38px}
  #uiMenu{min-width:196px;padding:6px}
  .uiRow{font-size:13px;padding:6px 9px}
  #focusBtn{font-size:13px;padding:7px 9px}
  #ladder{top:calc(48px + env(safe-area-inset-top,0px));transform:scale(.72);transform-origin:top right}
  footer{padding:0 calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));gap:6px}
  .bar{padding:7px 9px;gap:7px;border-radius:12px}
  .sec{gap:7px}
  .row{gap:7px}
  .chip{width:36px;height:36px;font-size:13px;border-radius:9px}
  .chip small{font-size:8px;top:2px;left:4px}
  .chip.wide{height:30px;padding:0 11px;font-size:12px}
  .legend{font-size:12px;gap:9px}
  .legend i{width:9px;height:9px}
  .speed{font-size:12px;gap:9px}
}
@media (orientation:landscape) and (max-height:560px){
  #card{max-width:44vw}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D viewer"></canvas>
<header>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="card" class="glass" role="status"><b></b><dl id="dl"></dl><span></span></div>
</header>

<div id="menuWrap">
  <div id="tbRow">
    <button class="btn" id="uiBtn" aria-haspopup="true" aria-expanded="false" title="Interface options">UI</button>
    <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menu</button>
  </div>
  <div id="menu" class="glass" hidden>
    <button data-view="atom">Atom model</button>
    <button data-view="mol">Hydrocarbons</button>
    <button data-view="amino">Amino acids</button>
    <button data-view="solar">Solar system</button>
    <button data-view="table">Periodic table</button>
  </div>
  <div id="uiMenu" class="glass" hidden>
    <label class="uiRow"><span>Header</span><input type="checkbox" id="tHeader" checked></label>
    <label class="uiRow"><span>Energy levels</span><input type="checkbox" id="tLadder" checked></label>
    <label class="uiRow"><span>Controls panel</span><input type="checkbox" id="tPanel" checked></label>
    <label class="uiRow"><span>Info card</span><input type="checkbox" id="tCard" checked></label>
    <hr>
    <button id="focusBtn" type="button">Hide all interface</button>
  </div>
</div>
<button id="showUI" type="button" hidden>Show UI</button>
<div id="ladder" class="glass" aria-label="Energy levels"></div>

<footer>
  <div class="bar glass">
    <div class="sec" id="atomUI">
      <div class="row">
        <div class="legend">
          <span><i style="background:var(--accent)"></i>Electrons <b id="ne"></b></span>
          <span><i style="background:#ff5a6e"></i>Protons <b id="np"></b></span>
          <span><i style="background:#a8b4cc"></i>Neutrons <b id="nn"></b></span>
        </div>
        <button class="btn switch" id="cloud" role="switch" aria-checked="false">Electron cloud</button>
      </div>
      <div class="chips" id="parts" role="group" aria-label="Focus on a part of the atom"></div>
      <div class="chips" id="chips" role="group" aria-label="Choose an element"></div>
      <div class="chips" id="isoChips" role="group" aria-label="Choose an isotope"></div>
    </div>
    <div class="sec" id="molUI" hidden>
      <div class="row">
        <div class="legend" id="molLegend"></div>
        <button class="btn switch" id="fill" role="switch" aria-checked="false">Space filling</button>
      </div>
      <div class="chips" id="pickHeads" role="group" aria-label="Categories"></div>
      <div class="chips" id="pickItems" role="group" aria-label="Compounds" hidden></div>
    </div>
    <div class="sec" id="solarUI" hidden>
      <div class="chips" id="solarSystems" role="group" aria-label="Destinations">
        <button class="chip wide" data-sys="0" type="button" aria-pressed="true">Solar System</button>
        <button class="chip wide" data-sys="1" type="button" aria-pressed="false">Proxima Centauri</button>
        <button class="chip wide" data-sys="2" type="button" aria-pressed="false">Neutron star</button>
        <button class="chip wide" data-sys="3" type="button" aria-pressed="false">Black hole</button>
        <button class="chip wide" data-sys="-1" type="button" aria-pressed="false">Overview</button>
      </div>
      <div class="chips" id="solarTools" role="group" aria-label="Solar system controls">
        <button class="chip wide" id="solarOrbits" type="button" aria-pressed="true">Orbits</button>
        <button class="chip wide" id="solarMoons" type="button" aria-pressed="true">Moons</button>
        <button class="chip wide" id="solarFabric" type="button" aria-pressed="true">Spacetime</button>
      </div>
    </div>
    <div class="sec" id="tableUI" hidden>
      <div class="legend" id="tableLegend" aria-label="Element categories"></div>
      <div class="chips" id="tableTools" role="group" aria-label="Zoom and view controls">
        <button class="chip wide" id="zoomOut" type="button">Zoom −</button>
        <button class="chip wide" id="zoomIn" type="button">Zoom +</button>
        <button class="chip wide" id="resetTable" type="button">Reset view</button>
      </div>
    </div>
    <div class="speed" id="speedRow">
      <label for="speed" id="speedLabel">Electron speed</label>
      <input id="speed" type="range" min="0" max="5" step="0.1" value="1">
      <output id="speedOut" for="speed">1.0×</output>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('c'), card = $('card'), slider = $('speed');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const V = THREE.Vector3, Zax = new V(0,0,1), YA = new V(0,1,0);
  const sub = s => String(s).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);
  const sup = s => String(s).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

  // ---------- Interface visibility ----------
  const UI = {header:true, ladder:true, panel:true, card:true, focus:false};
  const UI_KEY='atomlab.ui.v1';
  function loadUI(){
    try{
      const s=JSON.parse(localStorage.getItem(UI_KEY)||'null');
      if(s&&typeof s==='object'){
        ['header','ladder','panel','card'].forEach(k=>{ if(typeof s[k]==='boolean') UI[k]=s[k]; });
      }
    }catch(_){}
  }
  function saveUI(){
    try{ localStorage.setItem(UI_KEY, JSON.stringify({header:UI.header,ladder:UI.ladder,panel:UI.panel,card:UI.card})); }catch(_){}
  }
  function applyUI(){
    const b=document.body;
    b.classList.toggle('hide-header', !UI.header);
    b.classList.toggle('hide-ladder', !UI.ladder);
    b.classList.toggle('hide-panel', !UI.panel);
    b.classList.toggle('hide-card', !UI.card);
    b.classList.toggle('focus', !!UI.focus);
    $('tHeader').checked=UI.header;
    $('tLadder').checked=UI.ladder;
    $('tPanel').checked=UI.panel;
    $('tCard').checked=UI.card;
    $('showUI').hidden=!UI.focus;
    if(!UI.focus) closeUIMenu();
    saveUI();
  }
  loadUI();

  // ---------- Data ----------
  const ELS = ('H Hydrogen 1|He Helium 4|Li Lithium 7|Be Beryllium 9|B Boron 11|C Carbon 12|N Nitrogen 14|O Oxygen 16|F Fluorine 19|Ne Neon 20|'+
    'Na Sodium 23|Mg Magnesium 24|Al Aluminium 27|Si Silicon 28|P Phosphorus 31|S Sulfur 32|Cl Chlorine 35|Ar Argon 40|K Potassium 39|Ca Calcium 40|'+
    'Sc Scandium 45|Ti Titanium 48|V Vanadium 51|Cr Chromium 52|Mn Manganese 55|Fe Iron 56|Co Cobalt 59|Ni Nickel 58|Cu Copper 63|Zn Zinc 64|'+
    'Ga Gallium 69|Ge Germanium 74|As Arsenic 75|Se Selenium 80|Br Bromine 79|Kr Krypton 84|Rb Rubidium 85|Sr Strontium 88|Y Yttrium 89|Zr Zirconium 90|'+
    'Nb Niobium 93|Mo Molybdenum 98|Tc Technetium 98|Ru Ruthenium 102|Rh Rhodium 103|Pd Palladium 106|Ag Silver 107|Cd Cadmium 114|In Indium 115|Sn Tin 120|'+
    'Sb Antimony 121|Te Tellurium 130|I Iodine 127|Xe Xenon 132|Cs Caesium 133|Ba Barium 138|La Lanthanum 139|Ce Cerium 140|Pr Praseodymium 141|Nd Neodymium 142|'+
    'Pm Promethium 145|Sm Samarium 152|Eu Europium 153|Gd Gadolinium 158|Tb Terbium 159|Dy Dysprosium 164|Ho Holmium 165|Er Erbium 166|Tm Thulium 169|Yb Ytterbium 174|'+
    'Lu Lutetium 175|Hf Hafnium 180|Ta Tantalum 181|W Tungsten 184|Re Rhenium 187|Os Osmium 192|Ir Iridium 193|Pt Platinum 195|Au Gold 197|Hg Mercury 202|'+
    'Tl Thallium 205|Pb Lead 208|Bi Bismuth 209|Po Polonium 209|At Astatine 210|Rn Radon 222|Fr Francium 223|Ra Radium 226|Ac Actinium 227|Th Thorium 232|'+
    'Pa Protactinium 231|U Uranium 238|Np Neptunium 237|Pu Plutonium 244|Am Americium 243|Cm Curium 247|Bk Berkelium 247|Cf Californium 251|Es Einsteinium 252|Fm Fermium 257|'+
    'Md Mendelevium 258|No Nobelium 259|Lr Lawrencium 266|Rf Rutherfordium 267|Db Dubnium 268|Sg Seaborgium 269|Bh Bohrium 270|Hs Hassium 269|Mt Meitnerium 278|Ds Darmstadtium 281|'+
    'Rg Roentgenium 282|Cn Copernicium 285|Nh Nihonium 286|Fl Flerovium 289|Mc Moscovium 290|Lv Livermorium 293|Ts Tennessine 294|Og Oganesson 294').split('|').map(s=>{ const a=s.split(' '); return [a[0],a[1],+a[2]]; });
  const ISOTOPES = {
    1:[1,2,3], 2:[3,4], 3:[6,7], 4:[9,10], 5:[10,11], 6:[12,13,14], 7:[14,15],
    8:[16,17,18], 9:[19], 10:[20,21,22], 11:[22,23,24], 12:[24,25,26],
    13:[27], 14:[28,29,30], 15:[31,32,33], 16:[32,33,34,36], 17:[35,37], 18:[36,38,40],
    19:[39,40,41], 20:[40,42,43,44,46,48], 26:[54,56,57,58], 27:[59], 28:[58,60,61,62,64],
    29:[63,65], 30:[64,66,67,68,70], 35:[79,81], 47:[107,109], 50:[112,114,115,116,117,118,119,120,122,124],
    53:[127,131], 54:[129,131,132,134,136], 55:[133], 74:[182,183,184,186], 78:[194,195,196,198],
    79:[197], 80:[196,198,199,200,201,202,204], 82:[206,207,208], 86:[222], 88:[226],
    90:[232], 92:[234,235,238], 94:[239,240,244]
  };
  function isotopesOf(Z){
    if(ISOTOPES[Z]) return ISOTOPES[Z];
    const A = ELS[Z-1][2];
    return [A].filter(x => x >= Z);
  }
  const ORDER = [[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];
  const EXC = {24:[2,8,13,1],29:[2,8,18,1],41:[2,8,18,12,1],42:[2,8,18,13,1],44:[2,8,18,15,1],45:[2,8,18,16,1],46:[2,8,18,18],47:[2,8,18,18,1],
    57:[2,8,18,18,9,2],58:[2,8,18,19,9,2],64:[2,8,18,25,9,2],78:[2,8,18,32,17,1],79:[2,8,18,32,18,1],
    89:[2,8,18,32,18,9,2],90:[2,8,18,32,18,10,2],91:[2,8,18,32,20,9,2],92:[2,8,18,32,21,9,2],93:[2,8,18,32,22,9,2],96:[2,8,18,32,25,9,2],103:[2,8,18,32,32,8,3]};
  function shellsFor(Z){
    if(EXC[Z]) return EXC[Z];
    const s=[0,0,0,0,0,0,0]; let left=Z;
    for(const o of ORDER){ const k=Math.min(left, 2*(2*o[1]+1)); s[o[0]-1]+=k; left-=k; if(!left) break; }
    return s.filter(x=>x>0);
  }
  const SHELL_R = [2.6,4.0,5.4,6.8,8.2,9.6,11.0];
  const TILT = [[0.25,0.1],[1.0,0.5],[-0.6,0.9],[0.5,-0.4],[-0.9,0.3],[0.3,-0.7],[-0.75,0.55]];
  const SCH = ['#4cc9f0','#7b9cff','#c18bff','#ff8fd1','#ffb86b','#7ef0c0','#ffe066'];
  const SC = SCH.map(c=>parseInt(c.slice(1),16));
  const ANG = {sp3:109.5, sp2:120, sp:180};
  const EN = {C:'Carbon',H:'Hydrogen',N:'Nitrogen',O:'Oxygen',S:'Sulfur'};
  const COL = {C:0xff9f1c,H:0x22d3ee,N:0x4361ee,O:0xff3b3b,S:0xffe14d};
  const RB = {C:.38,H:.24,N:.36,O:.34,S:.45}, RF = {C:.85,H:.6,N:.8,O:.75,S:1};
  const HEX = c => '#'+c.toString(16).padStart(6,'0');
  const HYDRO = [['Methane',[],'Acyclic'],['Ethane',[1],'Acyclic'],['Propane',[1,1],'Acyclic'],['Butane',[1,1,1],'Acyclic'],['Pentane',[1,1,1,1],'Acyclic'],

  // ---------- Amino acid geometry ----------
  function aminoData(smi, seed){
    const at=[], bd=[], VAL={C:4,N:3,O:2,S:2}; let prev=-1, ord=1; const stack=[], ring={};

      for(let k=0;k<VAL[at[i].el]-s;k++){ at.push({el:'H'}); bd.push([i,at.length-1,1]); }
    }
    const n=at.length, nb=at.map(()=>[]), bl={}, cons=[], skip={};

    for(let c=0;c<heavy;c++){

      at[c].hyb = orders.includes(3)?'sp':orders.includes(2)?'sp2':'sp3';
      for(let p=0;p<nb[c].length;p++) for(let q=p+1;q<nb[c].length;q++){
        const x=nb[c][p], y=nb[c][q], l1=bl[c+'_'+x], l2=bl[c+'_'+y], a=ANG[at[c].hyb]*Math.PI/180;

  function buildMol(i){

  // ----- Burning star visual -----
  function createBurningStar(color, radius){
    const group = new THREE.Group();

    const core = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 32, 24),
      new THREE.MeshBasicMaterial({ color })
    );
    group.add(core);

    const glow1 = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 1.2, 32, 24),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    group.add(glow1);

    const glow2 = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 1.6, 32, 24),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.22, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    group.add(glow2);

    const corona = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 2.5, 32, 24),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.10, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    group.add(corona);

    const sparkCount = 30;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    for (let i = 0; i < sparkCount; i++){
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = radius * (1.3 + Math.random() * 0.9);
      sparkPos[i*3]   = Math.sin(phi) * Math.cos(theta) * r;
      sparkPos[i*3+1] = Math.cos(phi) * r;
      sparkPos[i*3+2] = Math.sin(phi) * Math.sin(theta) * r;
    }
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
      color:0xffffee, size: radius * 0.08, transparent:true, opacity:0.85,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    }));
    group.add(sparks);

    const light = new THREE.PointLight(color, 2.2, radius * 60);
    group.add(light);

    group.userData.starFx = { core, glow1, glow2, corona, sparks, light, radius, type:'star' };
    return group;
  }

  function animateStar(starGroup, time, dt){
    const fx = starGroup.userData.starFx;
    if (!fx || fx.type !== 'star') return;

    fx.glow1.scale.setScalar(1 + Math.sin(time * 2.3) * 0.03);
    fx.glow2.scale.setScalar(1 + Math.sin(time * 1.7 + 0.7) * 0.05);
    fx.corona.scale.setScalar(1 + Math.sin(time * 1.1 + 1.4) * 0.07);

    fx.glow1.material.opacity = 0.38 + Math.sin(time * 2.8) * 0.06;
    fx.glow2.material.opacity = 0.20 + Math.sin(time * 1.9 + 0.5) * 0.04;
    fx.corona.material.opacity = 0.09 + Math.sin(time * 1.4 + 1.0) * 0.02;

    fx.light.intensity = 2.0 + Math.sin(time * 3.2) * 0.3;

    fx.sparks.rotation.y += dt * 0.4;
    fx.sparks.rotation.x += dt * 0.2;
  }

  function animateExotic(dt, time){
    for (const ex of SOLAR.exoticBodies){
      const fx = ex.bodyGroup.userData.starFx;
      if (!fx) continue;

      if (fx.type === 'neutronStar'){
        ex.bodyGroup.rotation.y += dt * 2.5;
        if (fx.beams) fx.beams.rotation.y += dt * 1.8;
        if (fx.glow1) fx.glow1.scale.setScalar(1 + Math.sin(time * 4) * 0.05);
        if (fx.glow2) fx.glow2.scale.setScalar(1 + Math.sin(time * 2.5 + 1) * 0.06);
        if (fx.light) fx.light.intensity = 2.3 + Math.sin(time * 5) * 0.4;
      } else if (fx.type === 'blackHole'){
        if (fx.disk) fx.disk.rotation.z += dt * 0.2;
        if (fx.innerDisk) fx.innerDisk.rotation.z += dt * 0.45;
        if (fx.photon) fx.photon.rotation.z += dt * 0.08;
        if (fx.halo) fx.halo.scale.setScalar(1 + Math.sin(time * 2) * 0.03);
      }
    }
  }

  // ----- Spacetime fabric -----
  function buildFabric(){
    const segments = 80;
    const size = 280;
    const half = size / 2;
    const step = size / segments;

    const verts = [];
    for (let i = 0; i <= segments; i++){
      const z = -half + i * step;
      for (let j = 0; j < segments; j++){
        const x1 = -half + j * step;
        const x2 = x1 + step;
        verts.push(x1, 0, z, x2, 0, z);
      }
    }
    for (let i = 0; i <= segments; i++){
      const x = -half + i * step;
      for (let j = 0; j < segments; j++){
        const z1 = -half + j * step;
        const z2 = z1 + step;
        verts.push(x, 0, z1, x, 0, z2);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));

    const colors = new Float32Array(verts.length);
    for (let i = 0; i < verts.length / 3; i++){
      colors[i*3] = 0.25; colors[i*3+1] = 0.75; colors[i*3+2] = 0.94;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false
    });

    const mesh = new THREE.LineSegments(geo, mat);
    mesh.position.y = -1;
    mesh.renderOrder = -1;
    solarRoot.add(mesh);

    SOLAR.fabric = { mesh, geo, base: new Float32Array(verts), colors };
  }

  function updateFabric(){
    if (!SOLAR.fabric) return;
    const { geo, base } = SOLAR.fabric;
    const pos = geo.attributes.position;
    const col = geo.attributes.color;

    const masses = [];
    for (const sys of SOLAR.systems){
      masses.push({ x: sys.data.center.x, z: sys.data.center.z, mass: sys.data.starMass });
      for (const p of sys.planets){
        masses.push({
          x: sys.data.center.x + p.group.position.x,
          z: sys.data.center.z + p.group.position.z,
          mass: p.mass
        });
      }
    }
    for (const ex of SOLAR.exoticBodies){
      masses.push({ x: ex.data.position.x, z: ex.data.position.z, mass: ex.data.fabricMass });
    }

    const mc = masses.length;
    for (let i = 0; i < pos.count; i++){
      const x = base[i*3];
      const z = base[i*3+2];
      let dip = 0;
      for (let mi = 0; mi < mc; mi++){
        const m = masses[mi];
        const dx = x - m.x;
        const dz = z - m.z;
        dip -= m.mass / (dx*dx + dz*dz + 5);
      }
      if (dip < -40) dip = -40;
      pos.setY(i, dip);

      const depth = Math.min(1, -dip / 28);
      col.setXYZ(i,
        0.25 + depth * 0.7,
        0.75 - depth * 0.65,
        0.94 - depth * 0.85
      );
    }

    pos.needsUpdate = true;
    col.needsUpdate = true;
  }

  // ----- Build the whole system -----
  function buildStarSystem(sysData, sysIdx){
    const sysGroup = new THREE.Group();
    sysGroup.position.copy(sysData.center);
    solarRoot.add(sysGroup);

    const starGroup = createBurningStar(sysData.star.color, sysData.star.radius);
    sysGroup.add(starGroup);

    const starMeta = {
      name: sysData.star.name,
      isStar: true,
      systemIndex: sysIdx,
      focusTarget: starGroup,
      info: {
        type: sysData.star.type,
        temp: sysData.star.temp,
        planets: sysData.planets.length,
        desc: sysData.star.desc
      }
    };
    starGroup.userData.solar = starMeta;
    starGroup.traverse(child => {
      if (child.isMesh || child.isPoints) child.userData.solar = starMeta;
    });

    const planets = [];
    for (const p of sysData.planets){
      const planetGroup = new THREE.Group();
      sysGroup.add(planetGroup);

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.radius, 28, 20),
        new THREE.MeshStandardMaterial({
          color: p.color, roughness: 0.72, metalness: 0.05,
          emissive: p.color, emissiveIntensity: 0.1
        })
      );
      planetGroup.add(mesh);

      const planetMeta = {
        name: p.name, planet: true, systemIndex: sysIdx,
        focusTarget: planetGroup, planetRadius: p.radius, info: p.info
      };
      mesh.userData.solar = planetMeta;

      const pts = [];
      for (let i = 0; i <= 128; i++){
        const a = i / 128 * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * p.orbitRadius, 0, Math.sin(a) * p.orbitRadius));
      }
      const orbitLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.22 })
      );
      sysGroup.add(orbitLine);

      if (p.ring){
        const ringGeo = new THREE.RingGeometry(p.radius * 1.4, p.radius * 2.2, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xd8c088, side: THREE.DoubleSide, transparent: true, opacity: 0.55
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2 + 0.15;
        planetGroup.add(ring);
      }

      const moons = [];
      if (p.moons){
        for (const m of p.moons){
          const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(m.radius, 16, 12),
            new THREE.MeshStandardMaterial({
              color: m.color, roughness: 0.85, emissive: m.color, emissiveIntensity: 0.08
            })
          );
          planetGroup.add(moonMesh);

          const moonMeta = {
            name: m.name, moon: true, systemIndex: sysIdx,
            focusTarget: moonMesh,
            info: Object.assign({ parent: p.name }, m.info)
          };
          moonMesh.userData.solar = moonMeta;

          moons.push({
            mesh: moonMesh, data: m,
            orbitRadius: m.orbitRadius, speed: m.speed,
            angle: Math.random() * Math.PI * 2
          });
        }
      }

      planetGroup.position.x = Math.cos(p.initAngle) * p.orbitRadius;
      planetGroup.position.z = Math.sin(p.initAngle) * p.orbitRadius;

      planets.push({
        data: p, mesh, group: planetGroup, moons,
        orbitRadius: p.orbitRadius,
        angle: p.initAngle,
        angularSpeed: 0.6 / Math.pow(p.period, 0.4),
        mass: 3 + p.radius * 6,
        orbitLine
      });
    }

    SOLAR.systems.push({
      data: sysData, group: sysGroup, starGroup,
      starMass: sysData.starMass, planets
    });
  }

  function buildExoticBodies(){
    SOLAR.exoticBodies = [];
    EXOTIC_DATA.forEach((data, i) => {
      const group = new THREE.Group();
      group.position.copy(data.position);
      solarRoot.add(group);

      let bodyGroup;
      if (data.type === 'neutronStar') bodyGroup = createNeutronStar();
      else if (data.type === 'blackHole') bodyGroup = createBlackHole();
      else return;

      group.add(bodyGroup);

      const meta = {
        name: data.name,
        isExotic: true,
        systemIndex: SOLAR.systems.length + i,
        focusTarget: group,
        zoomRadius: data.zoomRadius,
        info: data.info
      };
      bodyGroup.userData.solar = meta;
      bodyGroup.traverse(child => {
        if (child.isMesh) child.userData.solar = meta;
      });

      SOLAR.exoticBodies.push({ data, group, bodyGroup });
    });
  }

  function buildSolarSystem(){
    clearRoot(solarRoot);
    SOLAR.systems = [];
    SOLAR.exoticBodies = [];
    SOLAR.fabric = null;

    buildFabric();

    for (let i = 0; i < SYSTEMS_DATA.length; i++){
      buildStarSystem(SYSTEMS_DATA[i], i);
    }

    buildExoticBodies();

    defR = 260;
    goal.theta = 0.5; goal.phi = 1.15;
  }

  function updateSolar(dt){
    const speed = +slider.value;
    const time = performance.now() / 1000;

    for (const sys of SOLAR.systems){
      if (sys.starGroup) animateStar(sys.starGroup, time, dt);

      if (speed > 0.01){
        for (const p of sys.planets){
          p.angle += p.angularSpeed * speed * dt;
          p.group.position.x = Math.cos(p.angle) * p.orbitRadius;
          p.group.position.z = Math.sin(p.angle) * p.orbitRadius;
          p.mesh.rotation.y += 0.4 * speed * dt;

          for (const m of p.moons){
            m.angle += m.speed * speed * dt * 0.5;
            m.mesh.position.x = Math.cos(m.angle) * m.orbitRadius;
            m.mesh.position.z = Math.sin(m.angle) * m.orbitRadius;
          }
        }
      }
    }

    // Exotic objects keep animating even when time is paused
    animateExotic(dt * Math.max(speed, 0.35), time);

    if (SOLAR.showFabric) updateFabric();
  }

  function showSolarInfo(info){
    if (!info) return;
    if (info.isExotic){
      showCard(info.name, [
        ['Type', info.info.type],
        ['Note', info.info.temp]
      ], info.info.desc);
    } else if (info.isStar){
      showCard(info.name, [
        ['Type', info.info.type],
        ['Surface temp', info.info.temp],
        ['Planets', info.info.planets]
      ], info.info.desc);
    } else if (info.planet){
      showCard(info.name, [
        ['Distance from star', info.info.distance],
        ['Orbital period', info.info.period],
        ['Rotation period', info.info.rotation],
        ['Moons', info.info.moons]
      ], info.info.desc);
    } else if (info.moon){
      showCard(info.name, [
        ['Orbits', info.info.parent],
        ['Orbital period', info.info.period],
        ['Diameter', info.info.diameter]
      ], info.info.desc);
    }
  }

  function focusSolar(body){
    const info = body.userData.solar;
    if (!info) return;

    if (info.systemIndex !== undefined){
      SOLAR.currentSystem = info.systemIndex;
      updateSolarChips();
    }

    focused = info.focusTarget;

    if (info.isExotic){
      goal.radius = info.zoomRadius || 20;
    } else if (info.isStar){
      goal.radius = info.systemIndex === 0 ? 70 : 22;
    } else if (info.planet){
      goal.radius = Math.max(6, info.planetRadius * 10);
    } else if (info.moon){
      goal.radius = 1.5;
    }

    showSolarInfo(info);
  }

  function focusSystemView(idx){
    focused = null;
    SOLAR.currentSystem = idx;
    updateSolarChips();

    if (idx === -1){
      goal.target.set(0, 0, 0);
      goal.radius = 260;
      showCard('Overview', [
        ['Systems', 'Solar System · Proxima Centauri'],

    } else if (idx < SOLAR.systems.length){
      const sys = SOLAR.systems[idx];

      goal.target.copy(sys.data.center);
      goal.radius = idx === 0 ? 70 : 22;
      showCard(sys.data.name, [
        ['Star', sys.data.star.name],
        ['Type', sys.data.star.type],
        ['Planets', sys.data.planets.length]
      ], sys.data.star.desc);
    } else {
      const exIdx = idx - SOLAR.systems.length;
      const ex = SOLAR.exoticBodies[exIdx];
      if (!ex) return;
      goal.target.copy(ex.data.position);
      goal.radius = ex.data.zoomRadius;
      showSolarInfo({
        name: ex.data.name,
        isExotic: true,
        info: ex.data.info
      });
    }
  }

  function updateSolarChips(){

  // ---------- Periodic table ----------
  const CATS=['Alkali metal','Alkaline earth','Transition metal','Post-transition','Metalloid','Nonmetal','Halogen','Noble gas','Lanthanide','Actinide'];
  const CATC=[0xf87171,0xfb923c,0x6366f1,0x2dd4bf,0xa78bfa,0x4ade80,0xa3e635,0xf472b6,0x38bdf8,0xe879f9];
  function catOf(Z){
    if(Z===1) return 5;
    if(Z===2) return 7;
    if([3,11,19,37,55,87].indexOf(Z)>=0) return 0;
    if([4,12,20,38,56,88].indexOf(Z)>=0) return 1;
    if(Z>=57&&Z<=71) return 8;
    if(Z>=89&&Z<=103) return 9;
    if([5,14,32,33,51,52].indexOf(Z)>=0) return 4;
    if([6,7,8,15,16,34].indexOf(Z)>=0) return 5;
    if([9,17,35,53,85,117].indexOf(Z)>=0) return 6;
    if([10,18,36,54,86,118].indexOf(Z)>=0) return 7;
    if([13,31,49,50,81,82,83,84,113,114,115,116].indexOf(Z)>=0) return 3;
    return 2;
  }
  function posOf(Z){
    if(Z===1) return [1,1];
    if(Z===2) return [18,1];
    if(Z<=10) return [Z<=4?Z-2:Z+8, 2];
    if(Z<=18) return [Z<=12?Z-10:Z, 3];
    if(Z<=36) return [Z-18, 4];
    if(Z<=54) return [Z-36, 5];
    if(Z<=56) return [Z-54, 6];
    if(Z<=71) return [Z-54, 8];
    if(Z<=86) return [Z-68, 6];
    if(Z<=88) return [Z-86, 7];
    if(Z<=103) return [Z-86, 9];
    return [Z-100, 7];
  }
  function sectionOf(Z){

    return 'c' + posOf(Z)[0];
  }
  function isMovable(sec){
    if (sec === 'lan' || sec === 'act') return true;
    const col = parseInt(sec.slice(1), 10);
    if (col === 1 || col === 18) return true;
    if (col >= 3 && col <= 12) return true;
    return false;
  }
  const SECTION_DIR = {};
  for(let c = 1; c <= 18; c++){
    if(c <= 2) SECTION_DIR['c' + c] = {x:-1, y:0, z:0};
    else if(c <= 12) SECTION_DIR['c' + c] = {x:0, y:0, z:1.3};
    else SECTION_DIR['c' + c] = {x:1, y:0, z:0};
  }
  SECTION_DIR.lan = {x:0, y:0, z:1.3};
  SECTION_DIR.act = {x:0, y:0, z:1.3};
  function familyOfCol(col){
    if(col <= 2) return 'left';
    if(col <= 12) return 'up';
    return 'right';
  }
  const SECTION_INFO = {
    c1:{name:'Group 1 · Alkali metals', desc:'Soft, highly reactive metals that react vigorously with water.'},
    c2:{name:'Group 2 · Alkaline earth metals', desc:'Reactive metals, harder than group 1.'},
    c3:{name:'Group 3 · Scandium group', desc:'Start of the f-block series.'},
    c4:{name:'Group 4 · Titanium group', desc:'Light, corrosion-resistant metals.'},
    c5:{name:'Group 5 · Vanadium group', desc:'Vanadium, niobium, tantalum.'},
    c6:{name:'Group 6 · Chromium group', desc:'Chromium, molybdenum, tungsten.'},
    c7:{name:'Group 7 · Manganese group', desc:'Manganese and rhenium.'},
    c8:{name:'Group 8 · Iron group', desc:'Iron, ruthenium, osmium.'},
    c9:{name:'Group 9 · Cobalt group', desc:'Cobalt, rhodium, iridium.'},
    c10:{name:'Group 10 · Nickel group', desc:'Nickel, palladium, platinum.'},
    c11:{name:'Group 11 · Coinage metals', desc:'Copper, silver, gold.'},
    c12:{name:'Group 12 · Zinc group', desc:'Zinc, cadmium, mercury.'},
    c13:{name:'Group 13 · Boron group', desc:'Includes aluminium and gallium.'},
    c14:{name:'Group 14 · Carbon group', desc:'Includes carbon, silicon and tin.'},
    c15:{name:'Group 15 · Pnictogens', desc:'Includes nitrogen and phosphorus.'},
    c16:{name:'Group 16 · Chalcogens', desc:'Includes oxygen and sulfur.'},
    c17:{name:'Group 17 · Halogens', desc:'Highly reactive nonmetals.'},
    c18:{name:'Group 18 · Noble gases', desc:'Full outer shells — inert and stable.'},
    lan:{name:'Lanthanides', desc:'Rare-earth metals used in magnets and phosphors.'},
    act:{name:'Actinides', desc:'Radioactive metals; most are synthetic.'}
  };
  const SECTION_DIST = 2.0;
  let selectedZ = null, selectedSection = null;

  function updateTableTargets(){
    tableCells.forEach(o=>{
      const u = o.userData;
      u.selX = 0; u.selY = 0; u.selZ = 0; u.selScale = 1;
    });
    if(!selectedSection || !selectedZ) return;
    if (!isMovable(selectedSection)){
      tableCells.forEach(o=>{
        if (o.userData.Z === selectedZ){
          o.userData.selZ = 0.9;
          o.userData.selScale = 1.18;
        }
      });
      return;
    }
    const dir = SECTION_DIR[selectedSection];
    if(!dir) return;
    const isLanAct = selectedSection === 'lan' || selectedSection === 'act';
    const selCol = isLanAct ? null : parseInt(selectedSection.slice(1), 10);
    const fam = isLanAct ? selectedSection : familyOfCol(selCol);

    tableCells.forEach(o=>{
      const u = o.userData;
      if(u.section === selectedSection){
        const extra = (u.Z === selectedZ) ? 1.2 : 0;
        u.selX = dir.x * (SECTION_DIST + extra);
        u.selY = dir.y * (SECTION_DIST + extra);
        u.selZ = dir.z * (SECTION_DIST + extra);
        u.selScale = (u.Z === selectedZ) ? 1.28 : 1.05;
        return;
      }
      if(isLanAct) return;
      const col = posOf(u.Z)[0];
      if(familyOfCol(col) !== fam) return;
      const dcol = Math.abs(col - selCol);
      if(dcol < 1 || dcol > 4) return;
      const falloff = 1 - dcol / 5;
      const strength = falloff * falloff * 0.55;
      u.selX = dir.x * strength * SECTION_DIST;
      u.selY = dir.y * strength * SECTION_DIST;
      u.selZ = dir.z * strength * SECTION_DIST;
      u.selScale = 1 + 0.05 * falloff;
    });
  }

  function clearTableSelection(){
    selectedZ = null; selectedSection = null;
    updateTableTargets();
  }
  function handleTableTap(Z){
    if(selectedZ === Z){
      clearTableSelection(); lastHover = null; card.classList.remove('on');
      openAtom(Z);
      return;
    }
    selectedZ = Z; selectedSection = sectionOf(Z);
    updateTableTargets();
    lastHover = null;
    const info = SECTION_INFO[selectedSection];
    const movable = isMovable(selectedSection);
    if(info) showCard(info.name, [], info.desc + (movable ? ' Tap the same element again to open its atom.' : ' (Stays in place.) Tap the same element again to open its atom.'));
  }

  const TP=1.14, TC=0.96, TW=20.34, TH=10.78;
  const tX = c => (c-9.5)*TP, tY = r => (4.5-r)*TP - (r>=8?0.7:0) + 0.92;
  const TCOLS=11, TROWS=11;
  let tableCells=[], tableBuilt=false, fontRetry=false;

  function buildTable(){
    if(tableBuilt) return; tableBuilt=true;
    const MAXTEX=renderer.capabilities.maxTextureSize||4096;
    const SZ=MAXTEX>=4096?4096:2048;
    const cw=SZ/TCOLS, ch=SZ/TROWS, S=Math.min(cw,ch);
    const cv=document.createElement('canvas'); cv.width=cv.height=SZ;
    const g=cv.getContext('2d'), FAM='Outfit, system-ui, sans-serif';
    const roundRect=(x,y,w,h,r)=>{
      g.beginPath();
      g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
      g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
      g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
      g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r);
      g.closePath();
    };
    ELS.forEach((el,i)=>{
      const Z=i+1, base=CATC[catOf(Z)], col=i%TCOLS, row=(i/TCOLS)|0;
      const x=col*cw, y=row*ch, bg='#'+base.toString(16).padStart(6,'0');
      g.fillStyle=bg; g.fillRect(x,y,cw,ch);
      const gr=g.createLinearGradient(x,y,x,y+ch);
      gr.addColorStop(0,'rgba(255,255,255,.22)');
      gr.addColorStop(.42,'rgba(255,255,255,.02)');
      gr.addColorStop(1,'rgba(0,0,0,.28)');
      g.fillStyle=gr; g.fillRect(x,y,cw,ch);
      const inset=S*0.055;
      g.strokeStyle='rgba(255,255,255,.30)'; g.lineWidth=Math.max(2,S*0.011);
      roundRect(x+inset,y+inset,cw-inset*2,ch-inset*2,S*0.12); g.stroke();
      const ew=Math.max(3,S*0.024);
      g.strokeStyle='rgba(4,10,18,.50)'; g.lineWidth=ew;
      g.strokeRect(x+ew/2,y+ew/2,cw-ew,ch-ew);
      const R=(base>>16)&255, G=(base>>8)&255, B=base&255;
      const L=(0.2126*R+0.7152*G+0.0722*B)/255;
      const dark=L>0.62;
      const ink=dark?'rgba(8,20,32,.94)':'rgba(255,255,255,.97)';
      const ink2=dark?'rgba(8,20,32,.60)':'rgba(255,255,255,.66)';
      const shad=dark?'rgba(255,255,255,.40)':'rgba(3,8,16,.45)';
      const pad=S*0.115;
      const zS=S*0.145;
      g.font='600 '+zS+'px '+FAM;
      const zw=g.measureText(String(Z)).width;
      const bw=zw+zS*0.62, bh=zS*1.14, bx=x+pad, by=y+pad;
      g.fillStyle=dark?'rgba(255,255,255,.44)':'rgba(6,14,24,.22)';
      roundRect(bx,by,bw,bh,zS*0.34); g.fill();
      g.fillStyle=ink; g.textAlign='left'; g.textBaseline='middle';
      g.fillText(String(Z), bx+zS*0.31, by+bh*0.55);
      g.font='600 '+(S*0.40)+'px '+FAM;
      g.textAlign='center'; g.textBaseline='middle';
      g.shadowColor=shad; g.shadowBlur=S*0.035; g.shadowOffsetY=S*0.012;
      g.fillStyle=ink;
      g.fillText(el[0], x+cw/2, y+ch*0.485);
      g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetY=0;
      const maxW=cw-pad*2.6;
      let nS=S*0.112;
      g.font='500 '+nS+'px '+FAM;
      while(nS>9 && g.measureText(el[1]).width>maxW){ nS-=1.5; g.font='500 '+nS+'px '+FAM; }
      g.fillStyle=ink;
      g.fillText(el[1], x+cw/2, y+ch*0.775);
      g.font='500 '+(S*0.086)+'px '+FAM;
      g.textAlign='right'; g.textBaseline='alphabetic';
      g.fillStyle=ink2;
      g.fillText(String(el[2]), x+cw-pad*0.8, y+ch-pad*0.55);
    });
    const tex=new THREE.CanvasTexture(cv);
    tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    tex.minFilter=THREE.LinearMipmapLinearFilter;
    ELS.forEach((el,i)=>{
      const Z=i+1, p=posOf(Z), col=i%TCOLS, row=(i/TCOLS)|0;
      const u0=col/TCOLS, u1=(col+1)/TCOLS, v0=1-(row+1)/TROWS, v1=1-row/TROWS;
      const geo=new THREE.BoxGeometry(TC,TC,TC), uv=geo.attributes.uv;
      [0,1,4,5].forEach(f=>{
        for(let k=0;k<4;k++){
          const idx=f*4+k;
          uv.setXY(idx, u0+uv.getX(idx)*(u1-u0), v0+uv.getY(idx)*(v1-v0));
        }
      });
      uv.needsUpdate=true;
      const label=new THREE.MeshBasicMaterial({map:tex});
      const body=new THREE.MeshStandardMaterial({color:CATC[catOf(Z)], roughness:.5, metalness:.2, emissive:0xffffff, emissiveIntensity:0});
      const m=new THREE.Mesh(geo,[label,label,body,body,label,label]);
      const bx=tX(p[0]), by=tY(p[1]);
      m.position.set(bx, by, 0);
      m.userData={ kind:'el', Z, hover:1, lift:0, body, section:sectionOf(Z), baseX:bx, baseY:by, selX:0, selY:0, selZ:0, selScale:1 };
      tableRoot.add(m); tableCells.push(m);
    });
    $('tableLegend').innerHTML=CATS.map((n,i)=>'<span><i style="background:'+HEX(CATC[i])+'"></i>'+n+'</span>').join('');
    if(!fontRetry && document.fonts && document.fonts.status!=='loaded'){
      fontRetry=true;
      document.fonts.ready.then(()=>{ tableBuilt=false; tableCells.length=0; clearRoot(tableRoot); buildTable(); });
    }
  }
  function tableFit(){
    const vf=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
    return Math.max((TW/2)/Math.tan(hf/2), (TH/2)/Math.tan(vf/2))*1.3;
  }
  function openAtom(Z){ clearTableSelection(); if(view!=='atom') setView('atom'); build(Z-1); }

  // ---------- Views and menu ----------
  function enterView(){
    focused=null; lastHover=null;
    if(view !== 'solar') goal.target.set(0, 0, 0);
    goal.radius = defR;
    born = clock.getElapsedTime();
    card.classList.remove('on'); setPart(0); renderLadder(-1);
    rings.forEach(r=>{ r.material.opacity=0.28; });
  }
  function setView(v){
    const prev=view;
    view=v;
    const atom=v==='atom', table=v==='table', solar=v==='solar';
    atomRoot.visible=atom;
    molRoot.visible=!atom&&!table&&!solar;
    tableRoot.visible=table;
    solarRoot.visible=solar;
    $('atomUI').hidden=!atom;
    $('molUI').hidden=atom||table||solar;
    $('solarUI').hidden=!solar;
    $('tableUI').hidden=!table;
    $('speedRow').hidden=table;
    ladder.hidden=!atom;
    $('speedLabel').textContent = atom ? 'Electron speed' : (solar ? 'Time scale' : 'Spin speed');
    openGroup=null; userZoomed=false;
    if(atom){
      $('title').textContent=cur.name;
      $('sub').textContent=ELS[cur.Z-1][0]+'-'+cur.A+' · atomic number '+cur.Z+' · '+cur.N+' neutron'+(cur.N===1?'':'s')+' · shells '+cur.sh.join(', ');
      defR=SHELL_R[cur.sh.length-1]*2.4+3;
      enterView();
    } else if(table){
      buildTable(); defR=tableFit();
      $('title').textContent='Periodic table';
      $('sub').textContent='Tap a movable column (groups 1, 18, transition metals, rare earths) to separate it';
      clearTableSelection();

      enterView();
    } else if(solar){
      buildSolarSystem();
      enterView();
      const solCenter = SOLAR.systems[0].data.center;
      goal.target.copy(solCenter);
      goal.radius = 70;
      cam.radius = 70;
      cam.target.copy(solCenter);
      cam.theta = 0.4;
      cam.phi = 1.2;
      goal.theta = 0.4;
      goal.phi = 1.2;
      SOLAR.currentSystem = 0;
      updateSolarChips();
      $('title').textContent='Solar system';
      $('sub').textContent='Drag to orbit · scroll to zoom out and see Proxima, a neutron star, and a black hole';
      showCard('Solar System', [
        ['Star', 'The Sun (G2V)'],
        ['Planets', '8'],
        ['Nearest star', 'Proxima Centauri (4.24 ly)']
      ], 'Zoom out to reveal Proxima Centauri, a pulsar, and a black hole — all sagging into the fabric of spacetime.');
    } else {
      buildMol(curIdx[v]);
      goal.theta=0.6; goal.phi=1.2;
      enterView();
    }
    if(prev==='table' && !table){ goal.theta=0.6; goal.phi=1.2; }
    if(prev==='solar' && !solar){ goal.theta=0.6; goal.phi=1.2; }
    document.querySelectorAll('#menu button').forEach(b=>b.setAttribute('aria-current', b.dataset.view===v));

  }
  const menu=$('menu'), menuBtn=$('menuBtn'), uiMenu=$('uiMenu'), uiBtn=$('uiBtn');
  function closeMenu(){ menu.hidden=true; menuBtn.setAttribute('aria-expanded','false'); }
  function closeUIMenu(){ uiMenu.hidden=true; uiBtn.setAttribute('aria-expanded','false'); }
  menuBtn.addEventListener('click', ()=>{ const open=menu.hidden; closeUIMenu(); menu.hidden=!open; menuBtn.setAttribute('aria-expanded', String(open)); });
  uiBtn.addEventListener('click', ()=>{ const open=uiMenu.hidden; closeMenu(); uiMenu.hidden=!open; uiBtn.setAttribute('aria-expanded', String(open)); });
  menu.addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });

  $('tHeader').addEventListener('change', e=>{ UI.header=e.target.checked; applyUI(); });
  $('tLadder').addEventListener('change', e=>{ UI.ladder=e.target.checked; applyUI(); });
  $('tPanel').addEventListener('change', e=>{ UI.panel=e.target.checked; applyUI(); });
  $('tCard').addEventListener('change', e=>{ UI.card=e.target.checked; applyUI(); });
  $('focusBtn').addEventListener('click', ()=>{ UI.focus=true; applyUI(); });
  $('showUI').addEventListener('click', ()=>{ UI.focus=false; applyUI(); });

  addEventListener('keydown', e=>{
    if(e.key!=='Escape') return;
    if(UI.focus){ UI.focus=false; applyUI(); return; }
    closeMenu(); closeUIMenu();
  });

  $('cloud').addEventListener('click', e=>{ cloudMode=!cloudMode; e.currentTarget.setAttribute('aria-checked', cloudMode); applyMode(); if(cloudMode && focused && focused.userData.kind==='e') reset(); });
  $('fill').addEventListener('click', e=>{ spaceFill=!spaceFill; e.currentTarget.setAttribute('aria-checked', spaceFill); applyStyle(); if(spaceFill && focused && focused.userData.kind==='bond') reset(); });
  if(reduceMotion) slider.value=0;
  const showSpeed=()=>{ $('speedOut').textContent=(+slider.value).toFixed(1)+'×'; };
  slider.addEventListener('input', showSpeed); showSpeed();

  // ---------- Info card and focus ----------
  function showCard(title, rows, text){
    card.querySelector('b').textContent=title;
    $('dl').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');
    card.querySelector('span').textContent=text; card.classList.add('on');
  }
  function focusPart(s){
    focused=null; goal.target.set(0,0,0);
    rings.forEach((r,k)=>{ r.material.opacity=(s===k)?0.95:0.28; });
    if(s===null){
      goal.radius=nucR*3+3; setPart(1); renderLadder(-1);
      showCard('Nucleus', [['Protons',cur.Z],['Neutrons',cur.N],['Mass number',cur.Z+cur.N]], 'Protons and neutrons packed together. The protons decide the element, the neutrons add mass.');
    } else {
      goal.radius=SHELL_R[s]*2.2+2; setPart(s+2); renderLadder(s);
      const outer=s===cur.sh.length-1;
      showCard('Shell '+(s+1)+' (energy level n='+(s+1)+')', [['Electrons', cur.sh[s]+' of '+2*(s+1)*(s+1)],['Energy', s===0?'Lowest':outer?'Highest here':'Middle']],
        outer ? 'The outer shell. Its valence electrons decide how the atom bonds.' : 'Inner shells sit closer to the nucleus and have lower energy.');
    }
  }
  function molText(d){
    const hasO2=d.cnt[2] && d.nbr.includes('O');
    if(d.el==='C') return hasO2 ? 'The carbonyl carbon: a flat group with a double bond to oxygen.' : d.hyb==='sp3'?'Four single bonds pointing to the corners of a tetrahedron.':d.hyb==='sp2'?'Flat, with three groups spread 120° apart and one double bond.':'Linear, with a triple bond.';
    if(d.el==='N') return d.hyb==='sp2' ? 'Nitrogen in a C=N group, with three bonds in total.' : 'Nitrogen makes three bonds and keeps one lone pair. In an amino acid it forms the amine group.';
    if(d.el==='O') return d.cnt[2] ? 'Double-bonded oxygen, the C=O of a carbonyl group.' : 'Single-bonded oxygen, as in a hydroxyl (–OH) group, which can form hydrogen bonds.';
    if(d.el==='S') return 'Sulfur in the side chain, as a thiol (–SH) or a thioether (C–S–C).';
    return 'Hydrogen shares one electron pair with its neighbor.';
  }
  function focus(o){
    focused=o; const d=o.userData;
    rings.forEach(r=>{ r.material.opacity=0.28; });
    if(view!=='atom'){
      if(d.kind==='bond'){
        goal.radius=3.2;
        const bi=bondInfo(d.ea,d.eb,d.o,d.ar), kind=d.ar?'aromatic':({1:'single',2:'double',3:'triple'})[d.o];
        const T={single:'One shared electron pair. Atoms can rotate around a single bond.',double:'One sigma and one pi bond. Shorter and stronger than a single bond, and it holds the atoms flat.',
          triple:'One sigma and two pi bonds. The shortest and strongest, with the atoms in a straight line.',aromatic:'Part of an aromatic ring. Delocalized electrons make every ring bond identical, between single and double.'};
        showCard('Bond: '+d.ea+(d.o===2?'=':d.o===3?'≡':'–')+d.eb, [['Atoms',EN[d.ea]+' and '+EN[d.eb]],['Type',kind],['Length',bi[0]+' Å'],['Energy',bi[1]+' kJ/mol']], T[kind]);
        return;
      }
      goal.radius=d.el==='H'?2.8:3.4;
      const rows=d.el==='H' ? [['Bonded to',[...new Set(d.nbr)].map(e=>EN[e].toLowerCase()).join(', ')],['Bond','single']] : [['Hybridization',d.hyb],['Bond angle',ANG[d.hyb]+'°'],['Bonds',d.bonds]];
      showCard(EN[d.el]+' atom', rows, molText(d));
      return;
    }
    setPart(-1);
    goal.radius=d.kind==='e'?3.5:2.4;
    if(d.kind==='e'){ renderLadder(d.shell-1);
      showCard('Electron, energy level n='+d.shell, [['Charge','−1'],['Shell', d.shell+' of '+d.total],['Shell holds', d.count+' of '+d.cap],['Valence', d.valence?'Yes':'No']], d.valence?'An outer shell electron. These decide how the atom bonds.':'An inner shell electron, held tightly by the nucleus.'); }
    else if(d.kind==='p') showCard('Proton', [['Charge','+1'],['Mass','1.007 u'],['Made of','up, up, down quarks']], 'The number of protons decides which element this is.');
    else showCard('Neutron', [['Charge','0'],['Mass','1.009 u'],['Made of','up, down, down quarks']], 'Neutrons add mass and help hold the nucleus together.');
  }
  function reset(){
    focused=null;
    if(view !== 'solar') goal.target.set(0,0,0);
    goal.radius=defR;
    rings.forEach(r=>{ r.material.opacity=0.28; });
    card.classList.remove('on'); setPart(0); renderLadder(-1);
  }

  // ---------- Camera, zoom, pan and picking ----------
  const cam={theta:0.6, phi:1.2, radius:14, target:new V()}, goal={theta:0.6, phi:1.2, radius:14, target:new V()};
  const R_MIN=1.5, R_MAX=400;
  let dragging=false, moved=0, mode='orbit', hovered=null, focused=null, lastHover=null, userZoomed=false, pinch=null;
  let lastX=0, lastY=0;
  const ptrs=new Map();
  const mouse=new THREE.Vector2(9,9), ray=new THREE.Raycaster();
  ray.near=0.01;
  const pickables=()=>{
    if(view==='table') return tableCells;
    if(view==='solar'){
      const items = [];
      for (const sys of SOLAR.systems){
        items.push(sys.starGroup);
        for (const p of sys.planets){
          items.push(p.mesh);
          for (const m of p.moons) items.push(m.mesh);
        }
      }
      for (const ex of SOLAR.exoticBodies){
        items.push(ex.bodyGroup);
      }
      return items;
    }
    if(view!=='atom') return spaceFill ? molAtoms : molAtoms.concat(molBonds);
    return cloudMode ? nucleusParts : nucleusParts.concat(electrons);
  };

  function zoomBy(f){ goal.radius=clamp(goal.radius*f, R_MIN, R_MAX); userZoomed=true; }
  function panBy(dx,dy){
    if(view!=='table') return;
    const s=2*goal.radius*Math.tan(camera.fov*Math.PI/360)/innerHeight;
    const right=new V().setFromMatrixColumn(camera.matrixWorld,0);
    const up=new V().setFromMatrixColumn(camera.matrixWorld,1);
    goal.target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s);
    goal.target.x=clamp(goal.target.x,-TW/2,TW/2);
    goal.target.y=clamp(goal.target.y,-TH/2,TH/2);
    goal.target.z=0;
  }

  canvas.addEventListener('pointerdown', e=>{
    closeMenu(); closeUIMenu();
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    canvas.classList.add('drag');
    if(ptrs.size===1){
      dragging=true; moved=0; mode=(view==='table'&&!e.shiftKey)?'pan':'orbit';
      lastX=e.clientX; lastY=e.clientY;
    } else {
      moved=99; pinch=null;
      if(ptrs.size===2){
        const [a,b]=[...ptrs.values()];
        pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
      }
    }
  });
  canvas.addEventListener('pointermove', e=>{
    mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){
      moved=99;
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      if(pinch){ zoomBy(pinch.d/d); panBy(mx-pinch.mx, my-pinch.my); }
      pinch={d,mx,my};
      return;
    }
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(mode==='pan') panBy(dx,dy);
    else { goal.theta-=dx*0.006; goal.phi=clamp(goal.phi-dy*0.006,0.5,2.5); }
    lastX=e.clientX; lastY=e.clientY;
  });
  function endPtr(e, tap){
    ptrs.delete(e.pointerId);
    if(ptrs.size<2) pinch=null;
    if(ptrs.size===1){ const p=[...ptrs.values()][0]; lastX=p.x; lastY=p.y; }
    if(ptrs.size>0) return;
    dragging=false; canvas.classList.remove('drag');
    if(!tap || moved>=5) return;
    mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(pickables(), true)[0];
    if(view==='table'){
      if(hit) handleTableTap(hit.object.userData.Z);
      else { clearTableSelection(); lastHover = null; card.classList.remove('on'); }
    } else if(view==='solar'){
      if (hit && hit.object.userData.solar){
        focusSolar(hit.object);
      } else {
        const cur = SOLAR.currentSystem;
        if (cur >= 0 && cur < SOLAR.systems.length) focusSystemView(cur);
        else focusSystemView(-1);
      }
    } else {
      hit ? focus(hit.object) : reset();
    }
  }
  canvas.addEventListener('pointerup', e=>endPtr(e,true));
  canvas.addEventListener('pointercancel', e=>endPtr(e,false));

  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const d=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1);
    zoomBy(Math.exp(d*0.0012));
  }, {passive:false});

  $('zoomIn').addEventListener('click', ()=>zoomBy(0.72));
  $('zoomOut').addEventListener('click', ()=>zoomBy(1/0.72));
  $('resetTable').addEventListener('click', ()=>{
    goal.theta=0; goal.phi=1.26; goal.target.set(0,0,0); goal.radius=tableFit(); userZoomed=false;
    clearTableSelection(); lastHover=null; card.classList.remove('on');
  });

  function resize(){
    renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    if(view==='table' && tableBuilt){ defR=tableFit(); if(!userZoomed) goal.radius=defR; }
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', ()=>setTimeout(resize,220));
  if(window.visualViewport) visualViewport.addEventListener('resize', ()=>setTimeout(resize,140));
  resize();

  const clock=new THREE.Clock();
  build(5); setView('atom'); applyUI();

  function tick(){
    const dt=Math.min(clock.getDelta(),0.1), t=clock.getElapsedTime(), speed=+slider.value;

    if(view==='atom'){
      electrons.forEach(e=>{ const d=e.userData; d.angle+=dt*d.speed*speed; e.position.set(Math.cos(d.angle)*d.r,0,Math.sin(d.angle)*d.r); });
      if(!reduceMotion){
        nucleusParts.forEach(m=>{ const d=m.userData,w=0.008; m.position.set(d.base0.x+Math.sin(t*3+d.phase)*w, d.base0.y+Math.cos(t*2.6+d.phase)*w, d.base0.z+Math.sin(t*3.3+d.phase*1.7)*w); });
        clouds.forEach((c,i)=>{ c.rotation.y+=dt*0.05*(i+1); });
      }
    } else if(view==='mol' || view==='amino'){
      molRoot.rotation.y+=dt*speed*0.3;
    } else if(view==='solar'){
      updateSolar(dt);
    }

    // Pull target toward origin when zooming way out in solar view (unless focused)
    if (view === 'solar' && !focused){
      if (goal.radius > 130) focused = null;
      if (goal.radius > 100){
        goal.target.x *= 0.98;
        goal.target.z *= 0.98;
      }
    }

    const root=view==='atom'?atomRoot:view==='table'?tableRoot:view==='solar'?solarRoot:molRoot;
    const k0=Math.min(1,(t-born)/0.5), s=reduceMotion?1:1-Math.pow(1-k0,3); root.scale.setScalar(0.4+0.6*s);

    if(!dragging && !reduceMotion && !focused && view!=='table' && view!=='solar') goal.theta+=dt*0.08;
    const k=1-Math.pow(0.001,dt);
    if(focused) focused.getWorldPosition(goal.target);
    cam.theta+=(goal.theta-cam.theta)*k; cam.phi+=(goal.phi-cam.phi)*k; cam.radius+=(goal.radius-cam.radius)*k; cam.target.lerp(goal.target,k);
    camera.position.set(cam.target.x+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta), cam.target.y+cam.radius*Math.cos(cam.phi), cam.target.z+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta));
    camera.lookAt(cam.target);

    ray.setFromCamera(mouse,camera);
    const list=pickables();
    hovered = list.length ? ray.intersectObjects(list, true)[0] || null : null;
    canvas.classList.toggle('hover', !!hovered && !dragging);

    if(view==='table'){
      const zt = clamp((defR/Math.max(cam.radius,0.001) - 1)/1.6, 0, 1);
      const grow = 1 + 0.16*(zt*zt*(3-2*zt));
      const hv = hovered ? hovered.object : null;
      const kPos   = 1 - Math.exp(-dt / 0.16);
      const kScale = 1 - Math.exp(-dt / 0.2);

      tableCells.forEach(o=>{
        const u = o.userData;
        const on = (hv === o);
        u.hover += ((on ? 1.05 : 1) - u.hover) * kScale;
        u.lift  += ((on ? 0.24 : 0) - u.lift)  * kPos;
        const tx = u.baseX + u.selX;
        const ty = u.baseY + u.selY;
        const tz = u.selZ + u.lift;
        o.position.x += (tx - o.position.x) * kPos;
        o.position.y += (ty - o.position.y) * kPos;
        o.position.z += (tz - o.position.z) * kPos;
        const targetScale = grow * u.selScale * u.hover;
        const cur = o.scale.x;
        o.scale.setScalar(cur + (targetScale - cur) * kScale);
        const eTarget = clamp((u.hover - 1) * 4 + (u.Z === selectedZ ? 0.45 : 0), 0, 0.8);
        u.body.emissiveIntensity += (eTarget - u.body.emissiveIntensity) * kScale;
      });
    } else if(view==='solar'){
      const hv = hovered ? hovered.object : null;
      list.forEach(o=>{
        if (!o) return;
        o.traverse(child => {
          if (child.isMesh && child.material && child.material.emissiveIntensity !== undefined){
            const base = (child.userData.solar && (child.userData.solar.isStar || child.userData.solar.isExotic)) ? 0.35 : 0.1;
            const target = (hv && (hv === child || (hv.parent && hv.parent === child))) ? base + 0.4 : base;
            child.material.emissiveIntensity += (target - child.material.emissiveIntensity) * 0.15;
          }
        });
      });
    } else {
      list.forEach(o=>{
        if(!o.userData) return;
        const u=o.userData;
        if (u.solar) return;
        const want=((hovered&&hovered.object===o)||focused===o)?1.3:1;
        u.hover = (u.hover||1) + (want - (u.hover||1))*0.2;
        if(u.kind==='bond') o.scale.set(u.bx*u.hover,u.len,u.bx*u.hover);
        else o.scale.setScalar((u.base||1)*u.hover);
      });
    }

    if(view==='table'){
      const o = hovered ? hovered.object : null;
      if(o !== lastHover){
        lastHover = o;
        if(o){
          const Z = o.userData.Z, el = ELS[Z-1];
          showCard(el[1], [['Symbol',el[0]],['Atomic number',Z],['Mass number',el[2]],['Type',CATS[catOf(Z)]]], 'Tap again to open this atom in 3D.');
        } else if(selectedSection){
          const info = SECTION_INFO[selectedSection];
          if(info) showCard(info.name, [], info.desc + ' Tap the same element again to open its atom.');
          else card.classList.remove('on');
        } else card.classList.remove('on');
      }
    }

    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
